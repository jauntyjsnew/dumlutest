# ─── dwg.yml = kml.yml for DWG Viewer ─────────────────────────────────────────
# A verbatim copy of kml.yml (r.yml + app-extension support) for DWG Viewer,
# which ships a Quick Look preview extension (target DWGPreview, bundle id
# tools.rush.dwgviewer.preview). kml.yml stays KML Viewer's, ifc.yml IFC
# Viewer's; r.yml stays every other app's. Beyond this header, only the
# workflow name and the one-extension guard's message differ:
#   diff -u .github/workflows/kml.yml .github/workflows/dwg.yml
#
# What the extension needs and where it is handled:
#   inputs      extension_profile_base64 / mac_extension_profile_base64 (optional)
#   Extension   discovers the app-extension target + bundle id from the project
#   *Profile    installs pasted extension profiles
#   Version     stamps the extension Info.plist with the app's version/build
#   Catalyst    SUPPORTS_MACCATALYST on the extension target too
#   Auto Profile registers the extension bundle id (spaceship, API key) and
#               fetches its App Store profiles (iOS + Catalyst) when none were pasted
#   Manual Sign manual signing + profile on the extension target
#   Build App   extension entry in MacExportOptions.plist (iOS export: gym maps
#               every target's PROVISIONING_PROFILE by itself)
name: DWG

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'owner/repo'
        required: true
        type: string
      
      repository_branch:
        description: 'Branch'
        required: false
        type: string
        default: 'main'

      version:
        description: 'Version — leave EMPTY to take it from App Store Connect automatically'
        required: false
        type: string
        default: ''
      
      target_platform:
        description: 'Target'
        required: true
        type: choice
        options:
          - all_devices
          - iphone_and_ipad
          - iphone_only
          - ipad_only
          - macos_only
        default: 'all_devices'
      
      build_mode:
        description: 'Mode'
        required: true
        type: choice
        options:
          - build_only
          - publish_to_appstore
        default: 'build_only'
      
      npm_build_command:
        description: 'Build cmd'
        required: false
        type: string
        default: 'npm run build'
      
      provisioning_profile_base64:
        description: 'iOS profile base64'
        required: false
        type: string
      
      mac_provisioning_profile_base64:
        description: 'Mac profile base64'
        required: false
        type: string
      # [ext]
      extension_profile_base64:
        description: 'iOS profile base64 for the app extension (<bundle>.preview) — leave EMPTY to fetch it automatically'
        required: false
        type: string
      # [ext]
      mac_extension_profile_base64:
        description: 'Mac (Catalyst) profile base64 for the app extension — leave EMPTY to fetch it automatically'
        required: false
        type: string

      mac_category:
        description: 'Mac category UTI'
        required: false
        type: string
        default: 'public.app-category.utilities'


jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: "🔒"
        run: |
          if [ -n "${{ inputs.provisioning_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.provisioning_profile_base64 }}"
          fi
          if [ -n "${{ inputs.mac_provisioning_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.mac_provisioning_profile_base64 }}"
          fi
          # [ext]
          if [ -n "${{ inputs.extension_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.extension_profile_base64 }}"
          fi
          if [ -n "${{ inputs.mac_extension_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.mac_extension_profile_base64 }}"
          fi

      - name: Parse
        id: apple
        env:
          APPLE_CREDS: ${{ secrets.APPLE_CREDENTIALS }}
        run: |
          TEAM_ID=$(echo "$APPLE_CREDS" | jq -r '.team_id')
          CERT_B64=$(echo "$APPLE_CREDS" | jq -r '.certificate_base64')
          CERT_PASS=$(echo "$APPLE_CREDS" | jq -r '.certificate_password')
          INST_B64=$(echo "$APPLE_CREDS" | jq -r '.installer_certificate_base64 // empty')
          INST_PASS=$(echo "$APPLE_CREDS" | jq -r '.installer_certificate_password // .certificate_password')
          API_KEY_ID=$(echo "$APPLE_CREDS" | jq -r '.api_key_id')
          API_ISSUER=$(echo "$APPLE_CREDS" | jq -r '.api_issuer_id')
          API_B64=$(echo "$APPLE_CREDS" | jq -r '.api_key_base64')
          echo "::add-mask::$TEAM_ID"
          echo "::add-mask::$CERT_B64"
          echo "::add-mask::$CERT_PASS"
          echo "::add-mask::$API_KEY_ID"
          echo "::add-mask::$API_ISSUER"
          echo "::add-mask::$API_B64"
          if [ -n "$INST_B64" ]; then echo "::add-mask::$INST_B64"; fi
          if [ -n "$INST_PASS" ]; then echo "::add-mask::$INST_PASS"; fi
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT
          echo "certificate_base64=$CERT_B64" >> $GITHUB_OUTPUT
          echo "certificate_password=$CERT_PASS" >> $GITHUB_OUTPUT
          echo "installer_certificate_base64=$INST_B64" >> $GITHUB_OUTPUT
          echo "installer_certificate_password=$INST_PASS" >> $GITHUB_OUTPUT
          echo "api_key_id=$API_KEY_ID" >> $GITHUB_OUTPUT
          echo "api_issuer_id=$API_ISSUER" >> $GITHUB_OUTPUT
          echo "api_key_base64=$API_B64" >> $GITHUB_OUTPUT
      
      - name: Git
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      
      - name: Clone
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          token: ${{ secrets.GH_PAT }}
          path: app_temp
          
      - name: Init
        run: mv app_temp app
      
      - name: Config
        id: capacitor
        working-directory: app
        run: |
          if [ -f "capacitor.config.json" ]; then
            CONFIG_FILE="capacitor.config.json"
            IS_JSON=true
          elif [ -f "capacitor.config.ts" ]; then
            CONFIG_FILE="capacitor.config.ts"
            IS_JSON=false
          else
            exit 1
          fi

          if [ "$IS_JSON" = true ]; then
            CONFIG_CONTENT=$(cat "$CONFIG_FILE")
            APP_NAME=$(echo "$CONFIG_CONTENT" | jq -r '.appName // empty')
            APP_ID=$(echo "$CONFIG_CONTENT" | jq -r '.appId // empty')
            WEB_DIR=$(echo "$CONFIG_CONTENT" | jq -r '.webDir // "www"')
          else
            APP_NAME=$(sed -n "s/.*appName:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            APP_ID=$(sed -n "s/.*appId:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            WEB_DIR=$(sed -n "s/.*webDir:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            if [ -z "$WEB_DIR" ]; then WEB_DIR="www"; fi
          fi

          if [ -z "$APP_NAME" ] || [ -z "$APP_ID" ]; then exit 1; fi

          echo "::add-mask::$APP_NAME"
          echo "::add-mask::$APP_ID"
          APP_NAME_SAFE=$(echo "$APP_NAME" | tr ' ' '-')
          echo "::add-mask::$APP_NAME_SAFE"

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "bundle_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "web_dir=$WEB_DIR" >> $GITHUB_OUTPUT

      # Reads the next version straight from App Store Connect so the run never has to
      # ask. Highest versionString across iOS + macOS wins; still open -> reuse it,
      # already live -> +1. Filling the "version" input overrides all of this.
      - name: Auto Version Script
        uses: actions/checkout@v4
        with:
          path: .wf
          token: ${{ secrets.GH_PAT }}

      - name: Auto Version
        id: autover
        env:
          ASC_KEY_ID: ${{ steps.apple.outputs.api_key_id }}
          ASC_ISSUER_ID: ${{ steps.apple.outputs.api_issuer_id }}
          ASC_KEY_B64: ${{ steps.apple.outputs.api_key_base64 }}
          BUNDLE_ID: ${{ steps.capacitor.outputs.bundle_id }}
          MANUAL_VERSION: ${{ inputs.version }}
          BUILD_MODE: ${{ inputs.build_mode }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
        run: node "$GITHUB_WORKSPACE/.wf/.github/scripts/autover.cjs"
      
      - name: Node
        id: node_version
        working-directory: app
        run: |
          if [ -f "package.json" ]; then
            CAP_VER=$(jq -r '.dependencies["@capacitor/core"] // .devDependencies["@capacitor/core"] // empty' package.json)
            if [ -z "$CAP_VER" ]; then
              NODE_VER="20"; MAJOR_VER="8"
            else
              MAJOR_VER=$(echo "$CAP_VER" | sed 's/[^0-9.]//g' | cut -d. -f1)
              if [ "$MAJOR_VER" -ge 8 ]; then NODE_VER="22"
              elif [ "$MAJOR_VER" -eq 7 ] || [ "$MAJOR_VER" -eq 6 ]; then NODE_VER="20"
              elif [ "$MAJOR_VER" -le 5 ]; then NODE_VER="18"; MAJOR_VER="5"
              else NODE_VER="20"; MAJOR_VER="8"; fi
            fi
          else
            NODE_VER="20"; MAJOR_VER="8"
          fi
          echo "version=$NODE_VER" >> $GITHUB_OUTPUT
          echo "capacitor_major=$MAJOR_VER" >> $GITHUB_OUTPUT
      
      - name: Detect
        id: features
        working-directory: app
        run: |
          HAS_RUST="false"
          RUST_ENGINE_DIR=""
          WASM_OUT_DIR=""
          if [ -d "rust" ]; then
            RUST_ENGINE_DIR=$(find rust -maxdepth 1 -type d ! -name rust | head -1)
            if [ -n "$RUST_ENGINE_DIR" ] && [ -f "$RUST_ENGINE_DIR/Cargo.toml" ]; then
              HAS_RUST="true"
              ENGINE_NAME=$(basename "$RUST_ENGINE_DIR" | sed 's/-wasm-engine//')
              WASM_OUT_DIR="src/wasm/${ENGINE_NAME}-engine"
            fi
          fi
          # ⛔ Yukarısı YALNIZ wasm motorunu tanır (`rust/<ad>-wasm-engine`).
          #    Native staticlib motorlar `rust-engine/` altında yaşar ve kendi
          #    `build-ios.sh`'ını taşır; bu blok eklenene kadar HAS_RUST false
          #    kalıyor, motor CI'da HİÇ derlenmiyor ve app motorsuz çıkıyordu.
          HAS_NATIVE_RUST="false"
          NATIVE_ENGINE_DIR=""
          NATIVE_BUILD_SCRIPT=""
          for cand in rust-engine ios/rust-engine engine; do
            if [ -f "$cand/Cargo.toml" ] && [ -f "$cand/build-ios.sh" ]; then
              HAS_NATIVE_RUST="true"; NATIVE_ENGINE_DIR="$cand"; NATIVE_BUILD_SCRIPT="$cand/build-ios.sh"; break
            fi
          done
          # Bir alt kademe (step-viewer-converter: rust-engine/step-rush/build-ios.sh)
          if [ "$HAS_NATIVE_RUST" != "true" ]; then
            s=$(find . -mindepth 2 -maxdepth 3 -name build-ios.sh -not -path './node_modules/*' 2>/dev/null | head -1)
            if [ -n "$s" ] && [ -f "$(dirname "$s")/Cargo.toml" ]; then
              HAS_NATIVE_RUST="true"; NATIVE_ENGINE_DIR="$(dirname "$s")"; NATIVE_BUILD_SCRIPT="$s"
            fi
          fi
          NATIVE_INJECTOR="$(ls scripts/inject-*.rb 2>/dev/null | head -1 || true)"
          echo "has_rust=$HAS_RUST" >> $GITHUB_OUTPUT
          echo "rust_engine_dir=$RUST_ENGINE_DIR" >> $GITHUB_OUTPUT
          echo "wasm_out_dir=$WASM_OUT_DIR" >> $GITHUB_OUTPUT
          echo "has_native_rust=$HAS_NATIVE_RUST" >> $GITHUB_OUTPUT
          echo "native_engine_dir=$NATIVE_ENGINE_DIR" >> $GITHUB_OUTPUT
          echo "native_build_script=$NATIVE_BUILD_SCRIPT" >> $GITHUB_OUTPUT
          echo "native_injector=$NATIVE_INJECTOR" >> $GITHUB_OUTPUT
          echo "engine: wasm=$HAS_RUST native=$HAS_NATIVE_RUST ${NATIVE_ENGINE_DIR:+($NATIVE_ENGINE_DIR)}"
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
      
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - name: Deps
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps 2>/dev/null || {
              rm -f package-lock.json
              npm install --legacy-peer-deps
            }
          else
            npm install --legacy-peer-deps
          fi
      
      - name: Cargo Cache
        if: steps.features.outputs.has_rust == 'true' || steps.features.outputs.has_native_rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/${{ steps.features.outputs.rust_engine_dir }}/target
            app/${{ steps.features.outputs.native_engine_dir }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/**/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      
      - name: Rust
        if: steps.features.outputs.has_rust == 'true' || steps.features.outputs.has_native_rust == 'true'
        run: |
          if ! command -v rustc &>/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source $HOME/.cargo/env 2>/dev/null || true
          rustc --version
          # wasm-pack YALNIZ wasm motoru için gerekir; native staticlib motorda
          # kurmak dakikalarca derleme demek.
          if [ "${{ steps.features.outputs.has_rust }}" == "true" ]; then
            command -v wasm-pack &>/dev/null || cargo install wasm-pack
            wasm-pack --version
          fi

      - name: WASM
        if: steps.features.outputs.has_rust == 'true'
        working-directory: app
        run: |
          source $HOME/.cargo/env
          RUST_DIR="${{ steps.features.outputs.rust_engine_dir }}"
          WASM_OUT="${{ steps.features.outputs.wasm_out_dir }}"
          if [ -f "$RUST_DIR/Makefile" ]; then
            make -C "$RUST_DIR" build
          else
            wasm-pack build "$RUST_DIR" --target web --out-dir "../../$WASM_OUT" --release
          fi
      
      - name: Build
        working-directory: app
        run: ${{ inputs.npm_build_command }}
      
      - name: Web Bundle Guard
        working-directory: app
        run: |
          # Does the build the runner just made actually contain what the app
          # loads at runtime? Two questions, both of which shipped as "no" and
          # neither of which any test in any app repo was asking.
          #
          # ⛔ WHY THIS EXISTS. GPXview 1.0.20 shipped a web worker that had
          # never been compiled: a commit lifted `new URL(...)` out of the
          # `new Worker(...)` call, Vite's worker plugin stopped matching that
          # expression, and the ASSET pipeline took the file instead — copying
          # `src/workers/gpx.worker.ts` into the build VERBATIM as
          # `assets/gpx.worker-<hash>.ts`. Capacitor serves `.ts` as
          # application/octet-stream (UTType maps it to mpeg-2-transport-stream,
          # which has no MIME type), so WebKit 14+ refuses the module worker and
          # reports a bare `error` event with no message, while WebKit 12/13
          # runs it as JavaScript and dies on the first type alias. Nineteen
          # field reports; not one file could be opened in that release.
          #
          # The source was never wrong. It type-checked, it linted, and the app
          # repo's 738 unit tests were green — because nothing looked at what
          # `vite build` emitted. That is precisely why the check belongs HERE,
          # on the runner that produces the archive, and not in a test suite
          # this workflow does not run.
          set -euo pipefail
          WEB_DIR="${{ steps.capacitor.outputs.web_dir }}"
          OUT=""
          for d in "dist" "$WEB_DIR" "build" "www"; do
            [ -n "$d" ] && [ -d "$d" ] && { OUT="$d"; break; }
          done
          if [ -z "$OUT" ]; then
            echo "::warning::no web output directory found after the build step; skipping the bundle guard"
            exit 0
          fi
          echo "Checking web bundle in: $OUT"
          FAIL=0

          # 1 — Raw TypeScript in the shipped bundle. There is no build in which
          #     this is correct: a `.ts`/`.tsx` file under the output directory
          #     means a module the bundler declined to compile and copied as a
          #     static asset, and the WebView cannot execute it.
          LEAKED=$(find "$OUT" -type f \( -name '*.ts' -o -name '*.tsx' \) -not -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::The build copied TypeScript source into the shipped bundle instead of compiling it. The WebView cannot run these files — Capacitor serves .ts as application/octet-stream, so a module worker refuses to start and reports a bare error event with no message. This is the GPXview 1.0.20 failure. Files:"
            echo "$LEAKED"
            echo "Cause to look for: a \`new Worker(...)\` whose first argument is NOT the literal expression \`new URL(\"...\", import.meta.url)\` written inside the call. Fix: import the worker as \`?worker&url\` and pass that."
            FAIL=1
          fi

          # 2 — A wasm engine that exists in src/ but never reached the bundle.
          #     wasm-pack output is only pulled in through whatever imports its
          #     glue; when that importer is a worker the bundler skipped, the
          #     ENGINE silently leaves the build with it. GPXview 1.0.20 shipped
          #     with no .wasm at all and the log said nothing.
          #     Opt out with a `.no-web-wasm` file in the app repo root, for an
          #     engine that is deliberately fetched at runtime rather than
          #     bundled. Same spirit as MAC-STRIPPED-OK below: an app that means
          #     it says so, and every other app stays guarded.
          SRC_WASM=$(find src -type f -name '*.wasm' 2>/dev/null | head -1 || true)
          if [ -n "$SRC_WASM" ] && [ ! -f ".no-web-wasm" ]; then
            OUT_WASM=$(find "$OUT" -type f -name '*.wasm' 2>/dev/null | head -1 || true)
            if [ -z "$OUT_WASM" ]; then
              echo "::error::src/ carries a WebAssembly engine ($SRC_WASM) but the build emitted no .wasm into $OUT — the engine is NOT in this archive and every operation that needs it will fail on the user's device. Usual cause: the only module that imports the wasm glue is a worker the bundler did not compile (see the TypeScript check above). If this app fetches its engine at runtime on purpose, add an empty .no-web-wasm file to the repo root."
              FAIL=1
            else
              echo "wasm engine present in bundle: $OUT_WASM"
            fi
          fi

          if [ "$FAIL" = "1" ]; then
            echo "This archive would not work on a user's device. Not uploading it."
            exit 1
          fi
          echo "Web bundle guard passed."
      
      - name: Native Engine
        if: steps.features.outputs.has_native_rust == 'true'
        working-directory: app
        env:
          NATIVE_ENGINE_DIR: ${{ steps.features.outputs.native_engine_dir }}
          NATIVE_BUILD_SCRIPT: ${{ steps.features.outputs.native_build_script }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env" 2>/dev/null || true

          ENGINE="$NATIVE_ENGINE_DIR"
          SCRIPT="$NATIVE_BUILD_SCRIPT"

          # ⛔ LTO release'te AÇIK olamaz: #[no_mangle] FFI sembolleri
          #    staticlib'den silinir ve arşiv linki App Store aşamasında
          #    patlar — simülatörde fark edilmez.
          if grep -Eq '^[[:space:]]*lto[[:space:]]*=[[:space:]]*(true|"fat"|"thin")' "$ENGINE/Cargo.toml"; then
            echo "::error::$ENGINE/Cargo.toml keeps release LTO on; the #[no_mangle] FFI symbols will be stripped"
            exit 1
          fi

          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios >/dev/null
          NEEDS_CATALYST=false
          case "$TARGET_PLATFORM" in all_devices|macos_only) NEEDS_CATALYST=true ;; esac
          if [ "$NEEDS_CATALYST" = true ]; then
            # ⛔ Mac'ler hem Apple Silicon hem Intel. Catalyst dilimi tek arch
            #    olursa motor kullanıcıların yarısına HİÇ ulaşmaz.
            rustup target add aarch64-apple-ios-macabi x86_64-apple-ios-macabi >/dev/null
          fi

          # ⛔ Motor süitini BURADA koşturma. `verify-native.yml` zaten host'ta ve
          #    `x86_64-apple-ios-macabi`'de koşuyor — yayın hattında tekrarlamak
          #    yalnız süre yakar, ve Catalyst güvencesini o workflow veriyor.

          # build-ios.sh'ı, Xcode'un vereceği env ile, gereken her platform
          # için çağır. Xcode Run Script fazı biçimindeki script'ler (kanonik:
          # PCAPviewerJargonix) bu değişkenleri okur; bağımsız script'ler
          # (jpeg-repair) yok sayıp zaten hepsini üretir — ikisi de doğru.
          run_slice() {
            label="$1"; shift
            echo "::group::build-ios.sh ($label)"
            ( cd "$(dirname "$SCRIPT")" && env "$@" bash "./$(basename "$SCRIPT")" )
            echo "::endgroup::"
          }
          run_slice device \
            SDK_NAME=iphoneos PLATFORM_NAME=iphoneos EFFECTIVE_PLATFORM_NAME=-iphoneos ARCHS=arm64
          run_slice simulator \
            SDK_NAME=iphonesimulator PLATFORM_NAME=iphonesimulator EFFECTIVE_PLATFORM_NAME=-iphonesimulator "ARCHS=arm64 x86_64"
          if [ "$NEEDS_CATALYST" = true ]; then
            run_slice "mac catalyst" \
              SDK_NAME=macosx PLATFORM_NAME=macosx EFFECTIVE_PLATFORM_NAME=-maccatalyst IS_MACCATALYST=YES "ARCHS=arm64 x86_64"
          fi

          # Ne üretildiğini SÖYLE. Eksik bir dilim aksi halde görünmez, ve
          # görünmediği için aylarca fark edilmez.
          echo "Static archives produced:"
          CAT_OK=0
          while IFS= read -r a; do
            archs="$(lipo -archs "$a" 2>/dev/null | tr '\n' ' ')"
            plats="$(otool -l "$a" 2>/dev/null | awk '/LC_BUILD_VERSION/{f=1} f&&/^ *platform/{print $2; f=0}' | sort -u | tr '\n' ' ')"
            printf '  %-58s archs=%-16s platform=%s\n' "${a#./}" "$archs" "$plats"
            case " $plats " in *" 6 "*)
              case "$archs" in *arm64*) case "$archs" in *x86_64*) CAT_OK=1 ;; esac ;; esac ;;
            esac
          done < <(find "$ENGINE" -name '*.a' -not -path '*/deps/*' -not -path '*/build/*' | sort)

          if [ "$NEEDS_CATALYST" = true ] && [ "$CAT_OK" -ne 1 ]; then
            echo "::error::No Mac Catalyst archive carrying BOTH arm64 and x86_64 was produced (platform 6 = MACCATALYST). The Catalyst build would either fail to link or reach only half of Mac users."
            exit 1
          fi
          echo "Native engine ready."
      
      - name: Sync
        working-directory: app
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
          TARGET: ${{ inputs.target_platform }}
        run: |
          WEB_DIR="${{ steps.capacitor.outputs.web_dir }}"
          if [ ! -d "$WEB_DIR" ]; then
            if [ -d "dist" ]; then mv dist "$WEB_DIR"
            elif [ -d "build" ]; then mv build "$WEB_DIR"
            elif [ -d "public" ]; then mv public "$WEB_DIR"
            else exit 1; fi
          fi
          NEEDS_CATALYST="false"
          if [ "$TARGET" == "all_devices" ] || [ "$TARGET" == "macos_only" ]; then
            NEEDS_CATALYST="true"
          fi
          USE_COCOAPODS="false"
          if [ "$CAP_MAJOR" -ge 8 ] && [ "$NEEDS_CATALYST" == "true" ]; then
            USE_COCOAPODS="true"
            # ⛔ `-d ios` YETMEZ: bir repo `ios/App/App/...` altında yalnız overlay
            #    dosyaları (MainViewController.swift, Plugins/) taşıyor olabilir —
            #    o zaman dizin VAR ama Xcode projesi YOK, üretim atlanır ve
            #    `cap sync` hiç var olmayan bir projeye koşar. Projenin kendisine bak.
            if [ ! -d "ios/App/App.xcodeproj" ]; then npx cap add ios --packagemanager cocoapods 2>/dev/null || npx cap add ios; fi
            npx cap sync ios --packagemanager cocoapods 2>/dev/null || npx cap sync ios
          else
            if [ ! -d "ios/App/App.xcodeproj" ]; then npx cap add ios; fi
            npx cap sync ios
          fi
          echo "USE_COCOAPODS=$USE_COCOAPODS" >> $GITHUB_ENV
      
      # ── Why this step exists ──────────────────────────────────────────────
      # MEASURED 2026-08-23, run 32664742253 (p7mViewer, all_devices). The archive
      # died at
      #   AppDelegate.swift:3:8: error: unable to resolve module dependency: 'CapApp_SPM'
      # `SPM Clean` below tears the CapApp-SPM package out of the project and
      # deletes the directory, because a Catalyst build links its plugins through
      # CocoaPods instead. Nothing removed the app's own references to that module,
      # so the App target still asked for a module that no longer existed.
      #
      # Capacitor 8's SPM layout lets an app keep its native sources INSIDE
      # CapApp-SPM/Sources/CapApp-SPM and reach them with `import CapApp_SPM`; the
      # storyboard then names the same module in customModule. p7mViewer keeps
      # MainViewController and RushFilePicker there, so the teardown deleted app
      # code, not just packaging. Both leftovers bite: the import fails the build
      # outright, and a stale customModule leaves the root view controller
      # unresolvable at runtime — black screen — even when the build passes.
      #
      # igc.yml already carried this step, for the same reason on igcViewer; it was
      # never folded back here, so every other app in this repo stayed exposed.
      # This copy is TOLERANT where igc.yml is strict: igcViewer always keeps its
      # sources in the package, so igc.yml fails when they are missing. Apps whose
      # sources already live in App/ are just as valid, so here every rescue is
      # conditional and an app with nothing to move walks through untouched.
      - name: Preserve app native sources (pre-SPM-teardown)
        if: env.USE_COCOAPODS == 'true'
        working-directory: app/ios/App
        run: |
          set -euo pipefail
          SRC="CapApp-SPM/Sources/CapApp-SPM"
          PRESERVED=0
          if [ -d "$SRC" ]; then
            mkdir -p App/Native
            for f in "$SRC"/*.swift; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              # The package's own marker file is not app code.
              [ "$base" = "CapApp-SPM.swift" ] && continue
              cp "$f" "App/Native/$base"
              echo "preserved: $base"
              PRESERVED=$((PRESERVED + 1))
            done
            if [ "$PRESERVED" -eq 0 ]; then rmdir App/Native 2>/dev/null || true; fi
          fi
          echo "preserved $PRESERVED app native source(s)"

          # The storyboard names the module its root view controller lives in.
          STORYBOARD="App/Base.lproj/Main.storyboard"
          if [ -f "$STORYBOARD" ] && grep -q 'customModule="CapApp_SPM"' "$STORYBOARD"; then
            /usr/bin/sed -i '' 's/customModule="CapApp_SPM"/customModule="App"/g' "$STORYBOARD"
            if grep -q 'customModule="CapApp_SPM"' "$STORYBOARD"; then
              echo "::error::storyboard still references CapApp_SPM"; exit 1
            fi
            echo "storyboard: customModule CapApp_SPM -> App"
          fi

          # The import that killed run 32664742253. Everything the app actually uses
          # through it — Capacitor, Cordova, the plugins — comes from the Pods build,
          # so dropping the line is enough; App target sources keep `import Capacitor`.
          HITS=$(grep -rl '^import CapApp_SPM$' App --include="*.swift" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | while read -r f; do
              /usr/bin/sed -i '' '/^import CapApp_SPM$/d' "$f"
              echo "dropped import CapApp_SPM: $f"
            done
          fi
          if grep -rq '^import CapApp_SPM$' App --include="*.swift" 2>/dev/null; then
            echo "::error::import CapApp_SPM survived the rewrite"; exit 1
          fi

          # Rescued files are on disk but in no target until the project says so.
          if [ "$PRESERVED" -gt 0 ]; then
            gem install xcodeproj --no-document >/dev/null 2>&1 || true
            ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            abort("App target not found") unless target
            group = project.main_group.find_subpath("App/Native", true)
            group.set_source_tree("SOURCE_ROOT")
            group.set_path("App/Native")
            added = 0
            Dir.glob("App/Native/*.swift").each do |path|
              name = File.basename(path)
              next if group.files.any? { |f| f.display_name == name }
              ref = group.new_reference(name)
              target.add_file_references([ref])
              added += 1
            end
            project.save
            puts "added #{added} app native source(s) to the App target"
            abort("no sources added to App target") if added.zero?
            '
          fi

      - name: SPM Clean
        if: env.USE_COCOAPODS == 'true'
        working-directory: app/ios/App
        run: |
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("App.xcodeproj")
          project.root_object.package_references.clear
          project.targets.each do |target|
            target.package_product_dependencies.clear
            target.dependencies.to_a.each do |dep|
              if dep.respond_to?(:product_ref) && dep.product_ref
                dep.remove_from_project
              end
            end
            bp = target.frameworks_build_phase
            next unless bp
            bp.files.to_a.each do |f|
              if f.respond_to?(:product_ref) && f.product_ref
                f.remove_from_project
              end
            end
          end
          project.main_group.recursive_children.each do |child|
            if child.respond_to?(:path) && child.path.to_s.include?("CapApp-SPM")
              child.remove_from_project rescue nil
            end
          end
          project.save
          '
          rm -rf CapApp-SPM
      
      - name: AdMob
        working-directory: app
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then exit 0; fi
          GAD_ID=""
          if [ -f "capacitor.config.json" ]; then
            GAD_ID=$(jq -r '.plugins.AdMob.appId // empty' capacitor.config.json)
          fi
          if [ -z "$GAD_ID" ] && [ -f "capacitor.config.ts" ]; then
            GAD_ID=$(grep -oE "ca-app-pub-[0-9]+~[0-9]+" capacitor.config.ts | head -1 || true)
          fi
          if [ -z "$GAD_ID" ]; then exit 0; fi
          if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_ID" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_ID" "$PLIST"
          fi
      
      - name: RC Patch
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app
        run: |
          PLUGIN_FILE=$(find node_modules/@revenuecat/purchases-capacitor/ios -name "PurchasesPlugin.swift" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_FILE" ] || [ ! -f "$PLUGIN_FILE" ]; then exit 0; fi
          if grep -q "#if !targetEnvironment(macCatalyst)" "$PLUGIN_FILE"; then exit 0; fi
          sed -i.bak 's/CommonFunctionality\.presentCodeRedemptionSheet()/#if !targetEnvironment(macCatalyst)\n            CommonFunctionality.presentCodeRedemptionSheet()\n            #else\n            \/\/ Not available on Mac Catalyst\n            call.reject("Not available on Mac Catalyst")\n            return\n            #endif/g' "$PLUGIN_FILE"

      - name: Geolocation Catalyst Patch
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app
        run: |
          GEO_DIR="node_modules/@capacitor/geolocation/ios/Sources/GeolocationPlugin"
          PLUGIN_FILE="$GEO_DIR/GeolocationPlugin.swift"
          CALLBACK_FILE="$GEO_DIR/GeolocationCallbackManager.swift"
          MODEL_FILE="$GEO_DIR/IONGLOCPositionModel+JSONTransformer.swift"
          if [ ! -f "$PLUGIN_FILE" ]; then exit 0; fi
          if grep -q "GPX_CATALYST_GEO_STUB" "$PLUGIN_FILE"; then exit 0; fi

          ORIG_PLUGIN=$(mktemp)
          ORIG_CALLBACK=$(mktemp)
          ORIG_MODEL=$(mktemp)
          cp "$PLUGIN_FILE" "$ORIG_PLUGIN"
          [ -f "$CALLBACK_FILE" ] && cp "$CALLBACK_FILE" "$ORIG_CALLBACK"
          [ -f "$MODEL_FILE" ] && cp "$MODEL_FILE" "$ORIG_MODEL"

          cat > "$PLUGIN_FILE" <<'SWIFT'
          #if targetEnvironment(macCatalyst)
          import Capacitor

          @objc(GeolocationPlugin)
          public class GeolocationPlugin: CAPPlugin, CAPBridgedPlugin {
              // GPX_CATALYST_GEO_STUB
              public let identifier = "GeolocationPlugin"
              public let jsName = "Geolocation"
              public let pluginMethods: [CAPPluginMethod] = [
                  .init(name: "getCurrentPosition", returnType: CAPPluginReturnPromise),
                  .init(name: "watchPosition", returnType: CAPPluginReturnCallback),
                  .init(name: "clearWatch", returnType: CAPPluginReturnPromise),
                  .init(name: "checkPermissions", returnType: CAPPluginReturnPromise),
                  .init(name: "requestPermissions", returnType: CAPPluginReturnPromise)
              ]

              @objc func getCurrentPosition(_ call: CAPPluginCall) { reject(call) }
              @objc func watchPosition(_ call: CAPPluginCall) { reject(call) }
              @objc func clearWatch(_ call: CAPPluginCall) { call.resolve() }

              @objc override public func checkPermissions(_ call: CAPPluginCall) {
                  call.resolve(["location": "denied", "coarseLocation": "denied"])
              }

              @objc override public func requestPermissions(_ call: CAPPluginCall) { reject(call) }

              private func reject(_ call: CAPPluginCall) {
                  call.reject("Geolocation is not available on Mac Catalyst.", "OS-PLUG-GLOC-0007")
              }
          }
          #else
          SWIFT
          cat "$ORIG_PLUGIN" >> "$PLUGIN_FILE"
          cat >> "$PLUGIN_FILE" <<'SWIFT'
          #endif
          SWIFT

          wrap_empty_for_catalyst() {
            TARGET_FILE="$1"
            ORIG_FILE="$2"
            [ -f "$TARGET_FILE" ] || return 0
            cat > "$TARGET_FILE" <<'SWIFT'
          #if targetEnvironment(macCatalyst)
          import Capacitor
          // GPX_CATALYST_GEO_STUB
          #else
          SWIFT
            cat "$ORIG_FILE" >> "$TARGET_FILE"
            cat >> "$TARGET_FILE" <<'SWIFT'
          #endif
          SWIFT
          }

          wrap_empty_for_catalyst "$CALLBACK_FILE" "$ORIG_CALLBACK"
          wrap_empty_for_catalyst "$MODEL_FILE" "$ORIG_MODEL"
      
      - name: Ruby
        run: |
          gem install fastlane
          gem install cocoapods
          gem install xcodeproj
      
      - name: iOS Target
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          if [ "$CAP_MAJOR" -ge 6 ]; then IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ]; then IOS_TARGET="13.0"
          else IOS_TARGET="15.0"; fi
          
          if [ -f "Podfile" ]; then
            sed -i.bak "s/platform :ios, '[0-9.]*'/platform :ios, '$IOS_TARGET'/g" Podfile
            rm -f Podfile.bak
          fi
          
          ruby -e "
          require 'xcodeproj'
          ios_target = '$IOS_TARGET'
          project = Xcodeproj::Project.open('App.xcodeproj')
          project.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ios_target
          end
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ios_target
            end
          end
          project.save
          "
          
          if [ -f "Podfile" ]; then pod install; fi
      
      - name: Native Plugin
        if: steps.features.outputs.has_native_rust == 'true' && steps.features.outputs.native_injector != ''
        working-directory: app
        env:
          NATIVE_INJECTOR: ${{ steps.features.outputs.native_injector }}
        run: |
          set -euo pipefail
          # `npx cap add ios` stok bir proje üretir; motoru ona bağlayan tek
          # şey bu script (bridging header + LIBRARY_SEARCH_PATHS + -l...).
          # `Ruby` adımı xcodeproj gem'ini kurdu, `iOS Target` pod install'u
          # yaptı — enjektör bu ikisinden SONRA koşmalı.
          ruby "$NATIVE_INJECTOR"
      
      - name: Catalyst
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
          cat <<EOF > enable_catalyst.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          # [ext] an embedded extension must support Catalyst too, or the Mac archive stops
          targets = project.targets.select { |t| t.name == 'App' || (t.respond_to?(:product_type) && t.product_type.to_s.include?('app-extension')) }
          exit(1) if targets.empty?
          targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['SUPPORTS_MACCATALYST'] = 'YES'
              config.build_settings['SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD'] = 'NO'
            end
          end
          project.save
          EOF
          ruby enable_catalyst.rb
      
      - name: Catalyst Pods
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          # ── Keep @capacitor/filesystem linkable for Mac ──────────────────
          # MEASURED 2026-07-27. @capacitor/filesystem v7+ depends on
          # IONFilesystemLib, which ships as a PREBUILT .xcframework whose
          # Info.plist carries exactly two slices: ios-arm64 and
          # ios-arm64_x86_64-simulator. There is no maccatalyst slice, so it can
          # never link into a Catalyst build — which is why this step used to
          # delete the pod outright. But deleting it does not remove the plugin
          # from packageClassList, so the app kept asking Capacitor for a class
          # that was not in the binary and every save died at runtime with
          # `"Filesystem" plugin is not implemented on ios` — on Mac AND in the
          # iOS ipa, because this job strips the SPM package and builds both
          # archives from these Pods. MHT Viewer shipped that way.
          #
          # v6 has no IONFilesystemLib: pure Swift, `import Capacitor` only. So
          # pin v6 here instead of amputating the feature. Verified end to end:
          # Mac Catalyst BUILD SUCCEEDED with CapacitorFilesystem.framework in
          # the bundle, and on a simulator `Filesystem.writeFile` returned a real
          # uri and the file was on disk. The JS API used across the portfolio
          # (writeFile/readFile/deleteFile/mkdir/readdir/stat + Directory,
          # Encoding) is identical in v6, and anything missing fails the TS build
          # loudly rather than at runtime.
          #
          # Safe here specifically: `cap sync` and `SPM Clean` have already run,
          # so nothing downstream resolves this package through SPM.
          if [ -f "../../node_modules/@capacitor/filesystem/package.json" ]; then
            FS_VER=$(node -p "require('../../node_modules/@capacitor/filesystem/package.json').version" 2>/dev/null || echo "")
            FS_MAJOR="${FS_VER%%.*}"
            if [ -n "$FS_MAJOR" ] && [ "$FS_MAJOR" -ge 7 ] 2>/dev/null; then
              echo "::notice::@capacitor/filesystem $FS_VER cannot link for Mac Catalyst (IONFilesystemLib.xcframework has no maccatalyst slice) — pinning v6 so the feature survives."
              (cd ../.. && npm install @capacitor/filesystem@^6.0.4 --legacy-peer-deps) || echo "::warning::filesystem downgrade failed — the pod will be stripped and the guard below will stop the build."
            fi
          fi

          if [ ! -f "Podfile" ]; then
            echo "platform :ios, '15.0'" > Podfile
            echo "target 'App' do" >> Podfile
            echo "  use_frameworks!" >> Podfile
            echo "  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'" >> Podfile
            echo "  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'" >> Podfile
            CAPS=$(find ../../node_modules -name "*.podspec" -path "*capacitor*" -o -name "*.podspec" -path "*revenuecat*" 2>/dev/null)
            for spec in $CAPS; do
              POD_DIR=$(dirname "$spec")
              POD_NAME=$(basename "$spec" .podspec)
              if [ "$POD_NAME" != "Capacitor" ] && [ "$POD_NAME" != "CapacitorCordova" ]; then
                echo "  pod '$POD_NAME', :path => '$POD_DIR'" >> Podfile
              fi
            done
            echo "end" >> Podfile
            pod install || pod install --repo-update
          fi
          
          # Only amputate Filesystem if the pin above did not take effect — a v6
          # podspec has no IONFilesystemLib dependency and links fine.
          if grep -qs "IONFilesystemLib" ../../node_modules/@capacitor/filesystem/CapacitorFilesystem.podspec; then
            echo "::warning::stripping CapacitorFilesystem — every Filesystem call in this binary will fail at runtime."
            sed -i.bak '/IONFilesystemLib/d' Podfile
            sed -i.bak '/CapacitorFilesystem/d' Podfile
          fi
          sed -i.bak '/Google-Mobile-Ads-SDK/d' Podfile
          sed -i.bak '/GoogleUserMessagingPlatform/d' Podfile
          sed -i.bak '/CapacitorCommunityAdmob/d' Podfile
          rm -f Podfile.bak
          
          if grep -q "post_install" Podfile; then
            sed -i.bak '/^post_install/,/^end$/d' Podfile
            rm -f Podfile.bak
          fi
          
          # IPHONEOS_DEPLOYMENT_TARGET belongs in post_install, not only in the
          # `Pods Target` step below. MEASURED 2026-07-28 (GPXview run
          # 30367343655): a later `pod install` — the one inside Build App's
          # prepare_geolocation_for_catalyst — regenerates Pods.xcodeproj and
          # throws away everything that step wrote, so every pod falls back to
          # its own podspec minimum. @capacitor/filesystem 6.0.4 declares
          # `s.ios.deployment_target = '13.0'`, which for Catalyst becomes
          # ios13.1-macabi, and at that target Xcode 26.6 does not emit an
          # error — swift-frontend CRASHES type-checking Filesystem.swift:253
          # (`Assertion failed: (inserted), addFix, ConstraintSystem.cpp:350`)
          # and the Mac archive dies. Reproduced locally both ways: the same
          # pod builds clean at ios15.0-macabi and crashes at ios13.1-macabi.
          # Setting it here makes it survive any number of later pod installs.
          # CODE_SIGN_STYLE is here for the same reason — `Pods Sign` writes it
          # into the project and that later pod install would drop it.
          if [ "$CAP_MAJOR" -ge 6 ] 2>/dev/null; then IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ] 2>/dev/null; then IOS_TARGET="13.0"
          else IOS_TARGET="15.0"; fi

          echo '' >> Podfile
          echo 'post_install do |installer|' >> Podfile
          echo '  installer.pods_project.targets.each do |target|' >> Podfile
          echo '    target.build_configurations.each do |config|' >> Podfile
          echo '      config.build_settings["SUPPORTS_MACCATALYST"] = "YES"' >> Podfile
          echo "      config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"$IOS_TARGET\"" >> Podfile
          echo '      config.build_settings["CODE_SIGN_IDENTITY"] = ""' >> Podfile
          echo '      config.build_settings["CODE_SIGN_STYLE"] = "Manual"' >> Podfile
          echo '      config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"' >> Podfile
          echo '      config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"' >> Podfile
          echo '    end' >> Podfile
          echo '  end' >> Podfile
          echo 'end' >> Podfile

          pod install
      
      - name: Stripped Plugin Guard
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app
        run: |
          # Last line of defence for the failure mode that cost real money twice:
          # a pod this job removed, whose JS the app still calls. `cap sync` leaves
          # the plugin in packageClassList either way, so the app asks Capacitor
          # for a class that is not in the binary and every call fails at runtime
          # with `"X" plugin is not implemented on ios` — in a paid feature, with
          # nothing in the build log, on Mac AND in the iOS ipa.
          #
          # Ask the only question that matters: does src/ import a package whose
          # pod is missing from the Podfile we are about to build? That stays
          # correct as the Podfile changes — when the v6 pin above works,
          # CapacitorFilesystem is present and this passes.
          #
          # A file whose import is a browser-only fallback (native path goes
          # through the app's own plugin) opts out with a MAC-STRIPPED-OK comment
          # — see mht-viewer-converter src/lib/cache-file.ts.
          PODFILE="ios/App/Podfile"
          [ -f "$PODFILE" ] || exit 0
          FAIL=0
          check() {
            NPM_PKG="$1"; POD_NAME="$2"
            grep -qs "pod '$POD_NAME'" "$PODFILE" && return 0
            OFFENDERS=""
            for f in $(grep -rls --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --include="*.vue" "$NPM_PKG" src/ 2>/dev/null); do
              grep -q "MAC-STRIPPED-OK" "$f" || OFFENDERS="$OFFENDERS $f"
            done
            [ -z "$OFFENDERS" ] && return 0
            echo "::error::$NPM_PKG is imported by src/ but $POD_NAME is not in the Podfile for this build, so the binary ships WITHOUT it and every call fails at runtime with '\"plugin is not implemented on ios\"' — on Mac and on iPhone. Offending files:$OFFENDERS"
            FAIL=1
          }
          check "@capacitor/filesystem" "CapacitorFilesystem"
          check "@capacitor-community/admob" "CapacitorCommunityAdmob"
          if [ "$FAIL" = "1" ]; then
              echo "Fix options: (a) let the v6 pin work, (b) write through your own native plugin method (pattern: mht-viewer-converter MHTEnginePlugin.writeCacheFile + src/lib/cache-file.ts), (c) build this app without Mac."
              exit 1
          fi
      
      - name: Pods Target
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          if [ "$CAP_MAJOR" -ge 6 ]; then export IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ]; then export IOS_TARGET="13.0"
          else export IOS_TARGET="15.0"; fi
          
          if [ ! -d "Pods/Pods.xcodeproj" ]; then exit 0; fi
          
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ENV['IOS_TARGET'] || '15.0'
            end
          end
          project.save
          "

      - name: Pods Sign
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        run: |
          if [ ! -d "Pods/Pods.xcodeproj" ]; then exit 0; fi
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("Pods/Pods.xcodeproj")
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
            end
          end
          project.save
          '
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Cert
        id: cert
        env:
          CERT_B64: ${{ steps.apple.outputs.certificate_base64 }}
          CERT_PASS: ${{ steps.apple.outputs.certificate_password }}
          INST_CERT_B64: ${{ steps.apple.outputs.installer_certificate_base64 }}
          INST_CERT_PASS: ${{ steps.apple.outputs.installer_certificate_password }}
          APPLE_TEAM_ID: ${{ steps.apple.outputs.team_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          
          echo "$CERT_B64" | base64 --decode > $CERT_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          INSTALLER_CERT_NAME=""
          if [ -n "$INST_CERT_B64" ]; then
            echo "$INST_CERT_B64" | base64 --decode > $INSTALLER_CERT_PATH
            security import $INSTALLER_CERT_PATH -P "$INST_CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            INSTALLER_CERT_NAME=$(security find-identity -v -p basic $KEYCHAIN_PATH | grep "3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ -n "$INSTALLER_CERT_NAME" ]; then
              echo "::add-mask::$INSTALLER_CERT_NAME"
            else
              INSTALLER_CERT_NAME="3rd Party Mac Developer Installer: $APPLE_TEAM_ID"
            fi
          fi
          
          echo "installer_cert_name=$INSTALLER_CERT_NAME" >> $GITHUB_OUTPUT
          security list-keychain -d user -s $KEYCHAIN_PATH
      
      # [ext] Which app-extension target does the project carry, and what is
      # its bundle id? Everything below keys off `steps.ext.outputs.*`; an app
      # without an extension leaves them empty and follows r.yml unchanged.
      - name: Extension
        id: ext
        working-directory: app/ios/App
        run: |
          echo "has_extension=false" >> $GITHUB_OUTPUT
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("App.xcodeproj")
          exts = project.targets.select { |t| t.respond_to?(:product_type) && t.product_type.to_s.include?("app-extension") }
          abort("dwg.yml handles ONE app extension; found: #{exts.map(&:name).join(", ")}") if exts.size > 1
          if exts.empty?
            puts "no app-extension target — extension steps stay idle"
          else
            ext = exts.first
            cfg = ext.build_configurations.find { |c| c.name == "Release" } || ext.build_configurations.first
            id = cfg.build_settings["PRODUCT_BUNDLE_IDENTIFIER"].to_s
            abort("extension #{ext.name} needs a literal PRODUCT_BUNDLE_IDENTIFIER (got #{id.inspect})") if id.empty? || id.include?("$(")
            File.write(ENV["GITHUB_OUTPUT"], "has_extension=true\next_name=#{ext.name}\next_bundle_id=#{id}\n", mode: "a")
            puts "extension #{ext.name} -> #{id}"
          end
          '

      # [ext] Pasted extension profiles, installed exactly like the app ones.
      - name: Extension iOS Profile
        id: ext_provision
        if: inputs.extension_profile_base64 != '' && steps.ext.outputs.has_extension == 'true'
        run: |
          PP_PATH=$RUNNER_TEMP/ext_profile.mobileprovision
          echo "${{ inputs.extension_profile_base64 }}" | base64 --decode > $PP_PATH
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "::add-mask::$UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "uuid=$UUID" >> $GITHUB_OUTPUT

      - name: Extension Mac Profile
        id: mac_ext_provision
        if: (inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only') && inputs.mac_extension_profile_base64 != '' && steps.ext.outputs.has_extension == 'true'
        run: |
          MAC_PP_PATH=$RUNNER_TEMP/mac_ext_profile.provisionprofile
          echo "${{ inputs.mac_extension_profile_base64 }}" | base64 --decode > $MAC_PP_PATH
          MAC_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $MAC_PP_PATH))
          echo "::add-mask::$MAC_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $MAC_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$MAC_UUID.provisionprofile
          echo "uuid=$MAC_UUID" >> $GITHUB_OUTPUT

      - name: iOS Profile
        id: provision
        if: inputs.provisioning_profile_base64 != ''
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "${{ inputs.provisioning_profile_base64 }}" | base64 --decode > $PP_PATH
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "::add-mask::$UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
      
      - name: Mac Profile
        id: mac_provision
        if: (inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only') && inputs.mac_provisioning_profile_base64 != ''
        run: |
          MAC_PP_PATH=$RUNNER_TEMP/mac_profile.provisionprofile
          echo "${{ inputs.mac_provisioning_profile_base64 }}" | base64 --decode > $MAC_PP_PATH
          MAC_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $MAC_PP_PATH))
          echo "::add-mask::$MAC_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $MAC_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$MAC_UUID.provisionprofile
          echo "uuid=$MAC_UUID" >> $GITHUB_OUTPUT
      
      - name: Version
        working-directory: app/ios/App
        run: |
          BUILD_NUM=$(date -u +"%Y%m%d%H%M")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.autover.outputs.version }}" App/Info.plist
          # [ext] App Store validation rejects an extension whose version/build
          # differ from the app's — stamp every NSExtension Info.plist the same.
          for EXT_PLIST in */Info.plist; do
            case "$EXT_PLIST" in App/Info.plist) continue;; esac
            if /usr/libexec/PlistBuddy -c "Print :NSExtension" "$EXT_PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$EXT_PLIST"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.autover.outputs.version }}" "$EXT_PLIST"
              echo "extension plist stamped: $EXT_PLIST"
            fi
          done
      
      - name: Display Name
        working-directory: app
        run: |
          APP_NAME="${{ steps.capacitor.outputs.app_name }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string $APP_NAME" ios/App/App/Info.plist
      
      - name: Mac Plist
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" App/Info.plist 2>/dev/null || true
          MAC_CAT="${{ inputs.mac_category }}"
          if [ -z "$MAC_CAT" ]; then MAC_CAT="public.app-category.utilities"; fi
          /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType $MAC_CAT" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string $MAC_CAT" App/Info.plist
      
      - name: Entitlements
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
              if [ ! -f "App/App.entitlements" ]; then
                cat <<EOF > App/App.entitlements
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>com.apple.security.app-sandbox</key>
                <true/>
                <key>com.apple.security.network.client</key>
                <true/>
                <key>com.apple.security.files.user-selected.read-write</key>
                <true/>
              </dict>
              </plist>
              EOF
              else
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox true" "App/App.entitlements"
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "App/App.entitlements"
                # read-WRITE, not read-only. MEASURED 2026-07-29 on a minimal Mac
                # Catalyst app, three signed variants: with only
                # files.user-selected.read-only, AppKit REFUSES to open the panel at
                # all -- "your app has the User Selected File Read entitlement but it
                # needs User Selected File Read/Write to display save panels" -- the
                # UIDocumentPickerViewController(forExporting:asCopy:true) delegate is
                # then NEVER called, so the app hangs on Save with nothing in any log
                # the user or we can see. The same app with read-write wrote the file
                # to disk; so did the unsandboxed control. asCopy:true does NOT make
                # this a read-only operation -- the system still gates the panel on the
                # write entitlement. Every app that saves on Mac through
                # rushPresentCatalystSaveDialog depends on this line.
                # Drop a stale read-only key first: a leftover one is what AppKit sees.
                /usr/libexec/PlistBuddy -c "Delete :com.apple.security.files.user-selected.read-only" "App/App.entitlements" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.files.user-selected.read-write true" "App/App.entitlements"
              fi
              
              cat <<EOF > link_entitlements.rb
              require 'xcodeproj'
              project = Xcodeproj::Project.open('App.xcodeproj')
              targets = project.targets.select { |t| t.name == 'App' }
              targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
                end
              end
              project.save
              EOF
              ruby link_entitlements.rb
              rm link_entitlements.rb
      
      - name: Platform
        working-directory: app/ios/App
        run: |
          IS_CATALYST="false"
          case "${{ inputs.target_platform }}" in
            "iphone_only") DESTINATION="generic/platform=iOS Simulator"; DEVICES="1" ;;
            "ipad_only") DESTINATION="generic/platform=iOS Simulator"; DEVICES="2" ;;
            "iphone_and_ipad") DESTINATION="generic/platform=iOS Simulator"; DEVICES="1,2" ;;
            "macos_only") DESTINATION="generic/platform=macOS,variant=Mac Catalyst"; DEVICES="1,2"; IS_CATALYST="true" ;;
            *) DESTINATION="generic/platform=macOS,variant=Mac Catalyst"; DEVICES="1,2"; IS_CATALYST="true" ;;
          esac
          
          if [ "${{ inputs.build_mode }}" == "build_only" ]; then
            CODE_SIGN_IDENTITY="-"; CODE_SIGNING_REQUIRED="NO"; CODE_SIGNING_ALLOWED="NO"
          else
            CODE_SIGN_IDENTITY="Apple Distribution"; CODE_SIGNING_REQUIRED="YES"; CODE_SIGNING_ALLOWED="YES"
          fi
          
          TEAM_ID="${{ steps.apple.outputs.team_id }}"
          APP_NAME_SAFE=$(echo "${{ steps.capacitor.outputs.app_name }}" | tr ' ' '-')
          
          echo "DESTINATION=$DESTINATION" >> $GITHUB_ENV
          echo "TARGET_DEVICES=$DEVICES" >> $GITHUB_ENV
          echo "IS_CATALYST=$IS_CATALYST" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> $GITHUB_ENV
          echo "CODE_SIGNING_REQUIRED=$CODE_SIGNING_REQUIRED" >> $GITHUB_ENV
          echo "CODE_SIGNING_ALLOWED=$CODE_SIGNING_ALLOWED" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "APP_NAME_SAFE=$APP_NAME_SAFE" >> $GITHUB_ENV
      
      # ─── Profiles, when none were pasted ──────────────────────────────
      # provisioning_profile_base64 / mac_provisioning_profile_base64 stay
      # exactly as they were: paste one and it is used, unchanged. This step
      # only runs for whichever of the two was left empty, and downloads the
      # app's existing App Store profile with the App Store Connect API key
      # that is already here for the upload.
      #
      # Matching is by APP ID, never by name: app_identifier is the bundle id
      # read out of the project being built, so two apps whose names both start
      # "pst" cannot collide.
      #
      # Idempotent — an existing valid profile is downloaded, not regenerated —
      # so nothing accumulates against Apple's per-account profile limit.
      - name: Auto Profile
        id: auto_profile
        if: inputs.build_mode == 'publish_to_appstore'
        run: |
          set -uo pipefail
          IOS_UUID="${{ steps.provision.outputs.uuid }}"
          MAC_UUID="${{ steps.mac_provision.outputs.uuid }}"
          NEED_MAC=false
          if [ "${{ inputs.target_platform }}" = "all_devices" ] || [ "${{ inputs.target_platform }}" = "macos_only" ]; then
            NEED_MAC=true
          fi
          # [ext] the extension's profiles follow the same rule: pasted → used, empty → fetched
          EXT_ID="${{ steps.ext.outputs.ext_bundle_id }}"
          EXT_IOS_UUID="${{ steps.ext_provision.outputs.uuid }}"
          EXT_MAC_UUID="${{ steps.mac_ext_provision.outputs.uuid }}"
          NEED_EXT_IOS=false; NEED_EXT_MAC=false
          if [ -n "$EXT_ID" ]; then
            [ -z "$EXT_IOS_UUID" ] && NEED_EXT_IOS=true
            [ "$NEED_MAC" = "true" ] && [ -z "$EXT_MAC_UUID" ] && NEED_EXT_MAC=true
          fi
          if [ -n "$IOS_UUID" ] && { [ "$NEED_MAC" != "true" ] || [ -n "$MAC_UUID" ]; } && [ "$NEED_EXT_IOS" != "true" ] && [ "$NEED_EXT_MAC" != "true" ]; then
            echo "profiles supplied in the dispatch inputs - nothing to fetch"
            echo "ios_uuid=" >> $GITHUB_OUTPUT
            echo "mac_uuid=" >> $GITHUB_OUTPUT
            echo "ext_ios_uuid=" >> $GITHUB_OUTPUT
            echo "ext_mac_uuid=" >> $GITHUB_OUTPUT
            exit 0
          fi

          BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
          if [ -z "$BUNDLE_ID" ]; then
            echo "::error::no bundle id - cannot fetch a profile"; exit 1
          fi
          API_KEY_CONTENT=$(echo "${{ steps.apple.outputs.api_key_base64 }}" | base64 --decode)
          API_KEY_PATH="$RUNNER_TEMP/auto_api_key.json"
          jq -n --arg key_id "${{ steps.apple.outputs.api_key_id }}" \
                --arg issuer_id "${{ steps.apple.outputs.api_issuer_id }}" \
                --arg key "$API_KEY_CONTENT" \
                '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_PATH"
          export SPACESHIP_SKIP_2FA_UPGRADE=1
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          INSTALLED_UUID=""
          grab() {
            # $1 sigh platform, $2 output basename, $3 install extension.
            # The uuid comes back in INSTALLED_UUID rather than on stdout: a
            # ::add-mask:: directive only registers on stdout, so printing the
            # value would capture the directive along with it.
            local PLAT="$1" BASE="$2" EXT="$3" ID="${4:-$BUNDLE_ID}"   # [ext] $4 = bundle id, defaults to the app's
            if ! fastlane run get_provisioning_profile \
                  api_key_path:"$API_KEY_PATH" \
                  app_identifier:"$ID" platform:"$PLAT" \
                  team_id:"${{ steps.apple.outputs.team_id }}" \
                  skip_install:true output_path:"$RUNNER_TEMP" filename:"$BASE" 2>&1 | tail -6; then
              echo "::error::could not obtain the $PLAT App Store profile for this app - read the fastlane error above. Only if it mentions FORBIDDEN or authentication does the App Store Connect API key need a wider role."
              exit 1
            fi
            local F="$RUNNER_TEMP/$BASE"
            [ -f "$F" ] || F=$(find "$RUNNER_TEMP" . -name "$BASE" -type f 2>/dev/null | head -1)
            if [ ! -f "$F" ]; then echo "::error::$PLAT profile was not written"; exit 1; fi
            INSTALLED_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$F"))
            echo "::add-mask::$INSTALLED_UUID"
            cp "$F" ~/Library/MobileDevice/Provisioning\ Profiles/$INSTALLED_UUID.$EXT
          }

          OUT_IOS=""
          OUT_MAC=""
          if [ -z "$IOS_UUID" ]; then
            echo "no iOS profile pasted - fetching"
            grab ios "auto_ios.mobileprovision" mobileprovision
            OUT_IOS="$INSTALLED_UUID"
            echo "  iOS profile ready"
          fi
          if [ "$NEED_MAC" = "true" ] && [ -z "$MAC_UUID" ]; then
            # "catalyst", not "macos": this pipeline's Mac build is Mac Catalyst,
            # and exportArchive rejects a plain Mac App Store profile for it.
            echo "no Mac profile pasted - fetching"
            grab catalyst "auto_mac.mobileprovision" provisionprofile
            OUT_MAC="$INSTALLED_UUID"
            echo "  Mac profile ready"
          fi
          echo "ios_uuid=$OUT_IOS" >> $GITHUB_OUTPUT
          echo "mac_uuid=$OUT_MAC" >> $GITHUB_OUTPUT

          # [ext] Extension profiles. sigh refuses a bundle id that is not
          # registered ("Could not find App with App Identifier"), and the
          # extension's id exists only as a Developer Portal bundle id, never
          # as an App Store Connect app record. `produce` cannot register it
          # with an API key (Apple-ID login only), so this talks to the App
          # Store Connect API through spaceship with the key already here:
          # find the bundle id, create it (platform IOS — Catalyst profiles
          # hang off the iOS bundle id) only when missing. Then sigh downloads
          # or creates the App Store profiles exactly as for the app.
          OUT_EXT_IOS=""
          OUT_EXT_MAC=""
          if [ "$NEED_EXT_IOS" = "true" ] || [ "$NEED_EXT_MAC" = "true" ]; then
            EXT_NAME="${{ steps.capacitor.outputs.app_name }} ${{ steps.ext.outputs.ext_name }}"
            if ! EXT_ID="$EXT_ID" EXT_NAME="$EXT_NAME" API_KEY_PATH="$API_KEY_PATH" ruby -e '
              require "spaceship"
              Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.from_json_file(ENV["API_KEY_PATH"])
              id = ENV["EXT_ID"]
              if Spaceship::ConnectAPI::BundleId.find(id)
                puts "bundle id #{id} already registered"
              else
                name = ENV["EXT_NAME"].gsub(/[^A-Za-z0-9 ]/, " ").squeeze(" ").strip
                name = "App Extension" if name.empty?
                Spaceship::ConnectAPI::BundleId.create(name: name, platform: "IOS", identifier: id)
                abort("bundle id #{id} was not created") unless Spaceship::ConnectAPI::BundleId.find(id)
                puts "bundle id #{id} registered as #{name.inspect}"
              end
            ' 2>&1 | tail -6; then
              echo "::error::could not register the extension bundle id $EXT_ID on the Developer Portal - read the spaceship error above (the App Store Connect API key needs the App Manager or Admin role for bundle ids)"
              exit 1
            fi
          fi
          if [ "$NEED_EXT_IOS" = "true" ]; then
            echo "no extension iOS profile pasted - fetching for $EXT_ID"
            grab ios "auto_ext_ios.mobileprovision" mobileprovision "$EXT_ID"
            OUT_EXT_IOS="$INSTALLED_UUID"
            echo "  extension iOS profile ready"
          fi
          if [ "$NEED_EXT_MAC" = "true" ]; then
            echo "no extension Mac profile pasted - fetching for $EXT_ID"
            grab catalyst "auto_ext_mac.mobileprovision" provisionprofile "$EXT_ID"
            OUT_EXT_MAC="$INSTALLED_UUID"
            echo "  extension Mac profile ready"
          fi
          echo "ext_ios_uuid=$OUT_EXT_IOS" >> $GITHUB_OUTPUT
          echo "ext_mac_uuid=$OUT_EXT_MAC" >> $GITHUB_OUTPUT

      - name: Manual Sign
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        env:
          PROFILE_UUID: ${{ steps.provision.outputs.uuid || steps.auto_profile.outputs.ios_uuid }}
          EXT_PROFILE_UUID: ${{ steps.ext_provision.outputs.uuid || steps.auto_profile.outputs.ext_ios_uuid }}   # [ext]
          EXT_BUNDLE_ID: ${{ steps.ext.outputs.ext_bundle_id }}   # [ext]
        run: |
          echo "require 'xcodeproj'" > disable_signing.rb
          echo "project = Xcodeproj::Project.open('App.xcodeproj')" >> disable_signing.rb
          echo "target = project.targets.find { |t| t.name == 'App' }" >> disable_signing.rb
          echo "target.build_configurations.each do |config|" >> disable_signing.rb
          echo "  config.build_settings['CODE_SIGN_STYLE'] = 'Manual'" >> disable_signing.rb
          echo "  config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'" >> disable_signing.rb
          echo "  config.build_settings['DEVELOPMENT_TEAM'] = '${{ steps.apple.outputs.team_id }}'" >> disable_signing.rb
          echo "  if ENV['PROFILE_UUID']" >> disable_signing.rb
          echo "    config.build_settings['PROVISIONING_PROFILE'] = ENV['PROFILE_UUID']" >> disable_signing.rb
          echo "    config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''" >> disable_signing.rb
          echo "  end" >> disable_signing.rb
          echo "end" >> disable_signing.rb
          # [ext] the extension signs manually with ITS OWN profile; without one the
          # archive would die later with a much less readable error, so stop here.
          echo "if ENV['EXT_BUNDLE_ID'].to_s != ''" >> disable_signing.rb
          echo "  project.targets.select { |t| t.respond_to?(:product_type) && t.product_type.to_s.include?('app-extension') }.each do |ext|" >> disable_signing.rb
          echo "    ext.build_configurations.each do |config|" >> disable_signing.rb
          echo "      config.build_settings['CODE_SIGN_STYLE'] = 'Manual'" >> disable_signing.rb
          echo "      config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'" >> disable_signing.rb
          echo "      config.build_settings['DEVELOPMENT_TEAM'] = '${{ steps.apple.outputs.team_id }}'" >> disable_signing.rb
          echo "      if ENV['EXT_PROFILE_UUID'].to_s != ''" >> disable_signing.rb
          echo "        config.build_settings['PROVISIONING_PROFILE'] = ENV['EXT_PROFILE_UUID']" >> disable_signing.rb
          echo "        config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''" >> disable_signing.rb
          echo "      else" >> disable_signing.rb
          echo "        abort(\"extension #{ext.name} (#{ENV['EXT_BUNDLE_ID']}) has no provisioning profile: paste extension_profile_base64 or let Auto Profile fetch one\")" >> disable_signing.rb
          echo "      end" >> disable_signing.rb
          echo "    end" >> disable_signing.rb
          echo "  end" >> disable_signing.rb
          echo "end" >> disable_signing.rb
          echo "project.save" >> disable_signing.rb
          ruby disable_signing.rb
          rm disable_signing.rb

      - name: Build App
        working-directory: app/ios/App
        run: |
          set -o pipefail
          if [ -d "App.xcworkspace" ]; then
            XC_ARG="-workspace App.xcworkspace"
            FL_ARG="workspace:App.xcworkspace"
          elif [ -d "App.xcodeproj" ]; then
            XC_ARG="-project App.xcodeproj"
            FL_ARG="project:App.xcodeproj"
          else
            exit 1
          fi

          prepare_geolocation_for_catalyst() {
            GEO_PODSPEC="../../node_modules/@capacitor/geolocation/CapacitorGeolocation.podspec"
            if [ -f "$GEO_PODSPEC" ] && grep -q "IONGeolocationLib" "$GEO_PODSPEC"; then
              sed -i.bak "/IONGeolocationLib/d" "$GEO_PODSPEC"
              rm -f "$GEO_PODSPEC.bak"
              # This pod install regenerates Pods.xcodeproj and discards what
              # the `Pods Target` / `Pods Sign` steps wrote into it. That is why
              # deployment target and signing style now live in the Podfile's
              # post_install (see `Catalyst Pods`) — do not move them back.
              if [ -f "Podfile" ]; then pod install; fi
            fi
          }

          if [ "${{ inputs.build_mode }}" == "build_only" ]; then
            
          if [ "${{ inputs.target_platform }}" == "all_devices" ]; then
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "generic/platform=iOS Simulator" \
                -derivedDataPath build-simulator \
                CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
                2>&1 | tee build-ios.log
              
              APP_PATH=$(find build-simulator -name "*.app" -type d | head -1)
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}-iOS-Simulator.app"
              zip -r "${APP_NAME_SAFE}-iOS-Simulator.app.zip" "${APP_NAME_SAFE}-iOS-Simulator.app"

              prepare_geolocation_for_catalyst
              
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "generic/platform=macOS,variant=Mac Catalyst" \
                -derivedDataPath build-macos \
                SUPPORTS_MACCATALYST=YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
                2>&1 | tee build-mac.log
              
              APP_PATH=$(find build-macos -name "*.app" -type d | head -1)
              find "$APP_PATH/Contents/Frameworks" -name "*.framework" -maxdepth 1 | while read fw; do
                codesign --force --sign - --timestamp=none --generate-entitlement-der "$fw" 2>/dev/null || true
              done
              find "$APP_PATH/Contents/Frameworks" -name "*.dylib" | while read dl; do
                codesign --force --sign - --timestamp=none "$dl" 2>/dev/null || true
              done
              codesign --force --sign - --deep --timestamp=none --generate-entitlement-der "$APP_PATH" 2>/dev/null || true
              
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}-macOS.app"
              zip -r "${APP_NAME_SAFE}-macOS.app.zip" "${APP_NAME_SAFE}-macOS.app"
              
            elif [ "$IS_CATALYST" == "true" ]; then
              prepare_geolocation_for_catalyst

              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "$DESTINATION" \
                -derivedDataPath build \
                SUPPORTS_MACCATALYST=YES DEVELOPMENT_TEAM="$TEAM_ID" \
                CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" CODE_SIGNING_ALLOWED="YES" \
                2>&1 | tee build.log
              
              APP_PATH=$(find build -name "*.app" -type d | head -1)
              if [ "${{ inputs.build_mode }}" == "build_only" ]; then
                find "$APP_PATH/Contents/Frameworks" -name "*.framework" -maxdepth 1 | while read fw; do
                  codesign --force --sign - --timestamp=none --generate-entitlement-der "$fw" 2>/dev/null || true
                done
                find "$APP_PATH/Contents/Frameworks" -name "*.dylib" | while read dl; do
                  codesign --force --sign - --timestamp=none "$dl" 2>/dev/null || true
                done
                codesign --force --sign - --deep --timestamp=none --generate-entitlement-der "$APP_PATH" 2>/dev/null || true
              fi
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}.app"
              zip -r "${APP_NAME_SAFE}.app.zip" "${APP_NAME_SAFE}.app"
              
            else
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "$DESTINATION" \
                -derivedDataPath build \
                DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
                CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
                2>&1 | tee build.log
              
              APP_PATH=$(find build -name "*.app" -type d | head -1)
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}.app"
              zip -r "${APP_NAME_SAFE}.app.zip" "${APP_NAME_SAFE}.app"
            fi
            
          else
            TEAM_ID="${{ steps.apple.outputs.team_id }}"
            XCARGS="DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES"
            export FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT=120
            export FASTLANE_XCODEBUILD_SETTINGS_RETRIES=6
            
            if [ "${{ inputs.target_platform }}" != "macos_only" ]; then
              fastlane run build_app \
                $FL_ARG scheme:"App" export_method:"app-store" \
                output_directory:"." output_name:"${APP_NAME_SAFE}-iOS.ipa" \
                export_team_id:"$TEAM_ID" xcargs:"$XCARGS" clean:true silent:true
            fi

            if [ "${{ inputs.target_platform }}" == "macos_only" ] || [ "${{ inputs.target_platform }}" == "all_devices" ]; then
              prepare_geolocation_for_catalyst

              MAC_PROFILE_UUID="${{ steps.mac_provision.outputs.uuid || steps.auto_profile.outputs.mac_uuid }}"
              if [ -z "$MAC_PROFILE_UUID" ]; then exit 1; fi
              
              BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
              INSTALLER_CERT_NAME="${{ steps.cert.outputs.installer_cert_name }}"
              
              echo '<?xml version="1.0" encoding="UTF-8"?>' > MacExportOptions.plist
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> MacExportOptions.plist
              echo '<plist version="1.0">' >> MacExportOptions.plist
              echo '<dict>' >> MacExportOptions.plist
              echo '    <key>method</key><string>app-store</string>' >> MacExportOptions.plist
              echo "    <key>teamID</key><string>$TEAM_ID</string>" >> MacExportOptions.plist
              echo '    <key>destination</key><string>export</string>' >> MacExportOptions.plist
              echo '    <key>signingStyle</key><string>manual</string>' >> MacExportOptions.plist
              echo '    <key>provisioningProfiles</key><dict>' >> MacExportOptions.plist
              echo "        <key>$BUNDLE_ID</key><string>$MAC_PROFILE_UUID</string>" >> MacExportOptions.plist
              # [ext] exportArchive signs every bundle in the archive: the extension needs its own line
              EXT_ID="${{ steps.ext.outputs.ext_bundle_id }}"
              EXT_MAC_UUID="${{ steps.mac_ext_provision.outputs.uuid || steps.auto_profile.outputs.ext_mac_uuid }}"
              if [ -n "$EXT_ID" ]; then
                if [ -z "$EXT_MAC_UUID" ]; then echo "::error::extension $EXT_ID has no Mac profile for the export"; exit 1; fi
                echo "        <key>$EXT_ID</key><string>$EXT_MAC_UUID</string>" >> MacExportOptions.plist
              fi
              echo '    </dict>' >> MacExportOptions.plist
              echo '</dict></plist>' >> MacExportOptions.plist
              
              MAC_XCARGS="DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE='' PROVISIONING_PROFILE_SPECIFIER=''"
              
              fastlane run build_app \
                $FL_ARG scheme:"App" catalyst_platform:"macos" \
                output_directory:"." output_name:"${APP_NAME_SAFE}-Mac" \
                xcargs:"$MAC_XCARGS" installer_cert_name:"$INSTALLER_CERT_NAME" \
                skip_profile_detection:true export_options:"MacExportOptions.plist" clean:true silent:true
            fi
          fi
      
      - name: GAD Inject
        working-directory: app
        run: |
          GAD_ID=""
          if [ -f "capacitor.config.json" ]; then
            GAD_ID=$(jq -r '.plugins.AdMob.appId // empty' capacitor.config.json 2>/dev/null)
          fi
          if [ -z "$GAD_ID" ] && [ -f "capacitor.config.ts" ]; then
            GAD_ID=$(grep -oE "ca-app-pub-[0-9]+~[0-9]+" capacitor.config.ts | head -1 || true)
          fi
          if [ -z "$GAD_ID" ]; then exit 0; fi
          find ios/App -name "*.app" -type d -maxdepth 5 | while read APP; do
            PLIST="$APP/Info.plist"
            if [ -f "$PLIST" ]; then
              if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_ID" "$PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_ID" "$PLIST"
              fi
            fi
          done

      - name: Upload
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        run: |
          API_KEY_CONTENT=$(echo "${{ steps.apple.outputs.api_key_base64 }}" | base64 --decode)
          BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
          TEAM_ID="${{ steps.apple.outputs.team_id }}"
          API_KEY_PATH="$RUNNER_TEMP/api_key.json"
          
          jq -n \
            --arg key_id "${{ steps.apple.outputs.api_key_id }}" \
            --arg issuer_id "${{ steps.apple.outputs.api_issuer_id }}" \
            --arg key "$API_KEY_CONTENT" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_PATH"
          
          if [ -f "${APP_NAME_SAFE}-iOS.ipa" ]; then
            fastlane run upload_to_app_store \
              api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
              ipa:"${APP_NAME_SAFE}-iOS.ipa" platform:"ios" \
              skip_metadata:true skip_screenshots:true \
              run_precheck_before_submit:false submit_for_review:false \
              skip_app_version_update:true
          fi

          MAC_FILE=""
          if [ -f "${APP_NAME_SAFE}-Mac.ipa" ]; then MAC_FILE="${APP_NAME_SAFE}-Mac.ipa"; MAC_TYPE="ipa"
          elif [ -f "${APP_NAME_SAFE}-Mac.pkg" ]; then MAC_FILE="${APP_NAME_SAFE}-Mac.pkg"; MAC_TYPE="pkg"; fi

          if [ -n "$MAC_FILE" ]; then
            if [ "$MAC_TYPE" == "ipa" ]; then
               fastlane run upload_to_app_store \
                api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
                ipa:"$MAC_FILE" platform:"osx" \
                skip_metadata:true skip_screenshots:true \
                run_precheck_before_submit:false submit_for_review:false \
                skip_app_version_update:true
            else
               fastlane run upload_to_app_store \
                api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
                pkg:"$MAC_FILE" platform:"osx" \
                skip_metadata:true skip_screenshots:true \
                run_precheck_before_submit:false submit_for_review:false \
                skip_app_version_update:true
            fi
          fi
      
      - name: Artifact iOS Sim
        if: inputs.build_mode == 'build_only' && inputs.target_platform == 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}-iOS-Simulator.app.zip
          retention-days: 1
      
      - name: Artifact macOS
        if: inputs.build_mode == 'build_only' && inputs.target_platform == 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}-macOS.app.zip
          retention-days: 1
      
      - name: Artifact App
        if: inputs.build_mode == 'build_only' && inputs.target_platform != 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}.app.zip
          retention-days: 1
      
      - name: Errors
        if: failure()
        run: |
          ERROR_FILE="$RUNNER_TEMP/error-summary.txt"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > "$ERROR_FILE"
          echo "═══════════════════════════════════════════" >> "$ERROR_FILE"
          echo "" >> "$ERROR_FILE"
          SEARCH_DIRS="app/ios/App ~/Library/Logs/gym /tmp"
          for DIR in $SEARCH_DIRS; do
            find $DIR -name "*.log" -o -name "*.txt" 2>/dev/null | head -30 | while read f; do
              grep -iHn "error:" "$f" 2>/dev/null | grep -v "warning:" | tail -30 >> "$ERROR_FILE" || true
              grep -iHn -E "(fatal|undefined symbol|linker|ld: |clang:|no library for this platform|Multiple commands produce|BUILD FAILED)" "$f" 2>/dev/null | tail -20 >> "$ERROR_FILE" || true
              grep -iHn -E "(cannot find|no such module|no library|xcframework|duplicate output)" "$f" 2>/dev/null | tail -20 >> "$ERROR_FILE" || true
              grep -iHn -E "(provisioning|signing|codesign|entitlement|CSSMERR)" "$f" 2>/dev/null | grep -i "error\|fail\|invalid\|no " | tail -15 >> "$ERROR_FILE" || true
            done
          done
          if [ "$(wc -l < "$ERROR_FILE")" -le 3 ]; then
            echo "[xcodebuild stdout/stderr]" >> "$ERROR_FILE"
            find ~/Library/Logs/gym -name "*.log" 2>/dev/null | head -5 | while read f; do
              tail -100 "$f" | grep -i "error\|fail\|no library\|xcframework" >> "$ERROR_FILE" || true
            done
          fi
          sort -u -o "$ERROR_FILE" "$ERROR_FILE"
          cat "$ERROR_FILE"
          echo "error_summary_path=$ERROR_FILE" >> $GITHUB_ENV
      
      - name: Error Upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e-${{ github.run_number }}
          path: ${{ env.error_summary_path }}
          retention-days: 1
          if-no-files-found: ignore
      
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l-${{ github.run_number }}
          path: |
            app/ios/App/build*/**/*.log
            app/ios/App/*.log
            ~/Library/Logs/gym/*.log
          retention-days: 1
          if-no-files-found: ignore
      
      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌" >> $GITHUB_STEP_SUMMARY
          fi

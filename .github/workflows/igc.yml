# ─── IGC Viewer release workflow ──────────────────────────────────────
# Fork of r.yml in THIS repo. Re-fork from r.yml when it changes; do not let
# the two diverge by editing this one in isolation.
#
# It exists because igcViewer is the only app in the portfolio that ships APP
# EXTENSIONS (Quick Look preview + thumbnail), and keeping them alive needs
# changes that would otherwise land on every other app for no reason.
#
# Differences from r.yml, all additive:
#   1. "Preserve app native sources" — before the SPM teardown, rescues
#      MainViewController / RushFilePicker / the open-with bridge out of
#      CapApp-SPM, which the next step deletes. Without it the storyboard asks
#      for a root view controller in a module that no longer exists: black screen.
#   2. "Verify app extensions survived" — cap sync, the SPM teardown and
#      pod install all rewrite App.xcodeproj. If one drops an extension the app
#      still builds and still ships, minus Quick Look. Fail instead.
#   3. Catalyst on every target, not just App.
#   4. "Extension Profiles" — r.yml signs one bundle id with the profile pasted
#      into the dispatch inputs. Extensions have their own bundle ids and no
#      profiles exist for them. Rather than making every release paste four more
#      base64 blobs, the App Store Connect API key already present for the
#      upload creates the identifiers and App Store profiles itself.
#   5. Everything stays MANUALLY signed, app and extensions alike. Automatic
#      signing was tried and cannot work here: it resolves to development, then
#      rejects an explicit Apple Distribution identity as conflicting, and a
#      development profile needs registered devices a CI runner does not have.
#      Both exports name a profile for every bundle id in the archive.

name: IGC

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'owner/repo'
        required: true
        type: string
      
      repository_branch:
        description: 'Branch'
        required: false
        type: string
        default: 'main'

      version:
        description: 'Version — leave EMPTY to take it from App Store Connect automatically'
        required: false
        type: string
        default: ''
      
      target_platform:
        description: 'Target'
        required: true
        type: choice
        options:
          - all_devices
          - iphone_and_ipad
          - iphone_only
          - ipad_only
          - macos_only
        default: 'all_devices'
      
      build_mode:
        description: 'Mode'
        required: true
        type: choice
        options:
          - build_only
          - publish_to_appstore
        default: 'build_only'
      
      npm_build_command:
        description: 'Build cmd'
        required: false
        type: string
        default: 'npm run build'
      
      provisioning_profile_base64:
        description: 'iOS profile base64'
        required: false
        type: string
      
      mac_provisioning_profile_base64:
        description: 'Mac profile base64'
        required: false
        type: string

      mac_category:
        description: 'Mac category UTI'
        required: false
        type: string
        default: 'public.app-category.utilities'

      allow_stripped_plugins:
        description: 'Ship even if src/ calls a plugin Catalyst cannot link (dead feature)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: "🔒"
        run: |
          if [ -n "${{ inputs.provisioning_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.provisioning_profile_base64 }}"
          fi
          if [ -n "${{ inputs.mac_provisioning_profile_base64 }}" ]; then
            echo "::add-mask::${{ inputs.mac_provisioning_profile_base64 }}"
          fi

      - name: Parse
        id: apple
        env:
          APPLE_CREDS: ${{ secrets.APPLE_CREDENTIALS }}
        run: |
          TEAM_ID=$(echo "$APPLE_CREDS" | jq -r '.team_id')
          CERT_B64=$(echo "$APPLE_CREDS" | jq -r '.certificate_base64')
          CERT_PASS=$(echo "$APPLE_CREDS" | jq -r '.certificate_password')
          INST_B64=$(echo "$APPLE_CREDS" | jq -r '.installer_certificate_base64 // empty')
          INST_PASS=$(echo "$APPLE_CREDS" | jq -r '.installer_certificate_password // .certificate_password')
          API_KEY_ID=$(echo "$APPLE_CREDS" | jq -r '.api_key_id')
          API_ISSUER=$(echo "$APPLE_CREDS" | jq -r '.api_issuer_id')
          API_B64=$(echo "$APPLE_CREDS" | jq -r '.api_key_base64')
          echo "::add-mask::$TEAM_ID"
          echo "::add-mask::$CERT_B64"
          echo "::add-mask::$CERT_PASS"
          echo "::add-mask::$API_KEY_ID"
          echo "::add-mask::$API_ISSUER"
          echo "::add-mask::$API_B64"
          if [ -n "$INST_B64" ]; then echo "::add-mask::$INST_B64"; fi
          if [ -n "$INST_PASS" ]; then echo "::add-mask::$INST_PASS"; fi
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT
          echo "certificate_base64=$CERT_B64" >> $GITHUB_OUTPUT
          echo "certificate_password=$CERT_PASS" >> $GITHUB_OUTPUT
          echo "installer_certificate_base64=$INST_B64" >> $GITHUB_OUTPUT
          echo "installer_certificate_password=$INST_PASS" >> $GITHUB_OUTPUT
          echo "api_key_id=$API_KEY_ID" >> $GITHUB_OUTPUT
          echo "api_issuer_id=$API_ISSUER" >> $GITHUB_OUTPUT
          echo "api_key_base64=$API_B64" >> $GITHUB_OUTPUT
      
      - name: Git
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      
      - name: Clone
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_url }}
          ref: ${{ inputs.repository_branch }}
          token: ${{ secrets.GH_PAT }}
          path: app_temp
          
      - name: Init
        run: mv app_temp app
      
      - name: Config
        id: capacitor
        working-directory: app
        run: |
          if [ -f "capacitor.config.json" ]; then
            CONFIG_FILE="capacitor.config.json"
            IS_JSON=true
          elif [ -f "capacitor.config.ts" ]; then
            CONFIG_FILE="capacitor.config.ts"
            IS_JSON=false
          else
            exit 1
          fi

          if [ "$IS_JSON" = true ]; then
            CONFIG_CONTENT=$(cat "$CONFIG_FILE")
            APP_NAME=$(echo "$CONFIG_CONTENT" | jq -r '.appName // empty')
            APP_ID=$(echo "$CONFIG_CONTENT" | jq -r '.appId // empty')
            WEB_DIR=$(echo "$CONFIG_CONTENT" | jq -r '.webDir // "www"')
          else
            APP_NAME=$(sed -n "s/.*appName:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            APP_ID=$(sed -n "s/.*appId:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            WEB_DIR=$(sed -n "s/.*webDir:[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" "$CONFIG_FILE" | head -1)
            if [ -z "$WEB_DIR" ]; then WEB_DIR="www"; fi
          fi

          if [ -z "$APP_NAME" ] || [ -z "$APP_ID" ]; then exit 1; fi

          echo "::add-mask::$APP_NAME"
          echo "::add-mask::$APP_ID"
          APP_NAME_SAFE=$(echo "$APP_NAME" | tr ' ' '-')
          echo "::add-mask::$APP_NAME_SAFE"

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "bundle_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "web_dir=$WEB_DIR" >> $GITHUB_OUTPUT

      # Reads the next version straight from App Store Connect so the run never has to
      # ask. Highest versionString across iOS + macOS wins; still open -> reuse it,
      # already live -> +1. Filling the "version" input overrides all of this.
      - name: Auto Version Script
        uses: actions/checkout@v4
        with:
          path: .wf
          token: ${{ secrets.GH_PAT }}

      - name: Auto Version
        id: autover
        env:
          ASC_KEY_ID: ${{ steps.apple.outputs.api_key_id }}
          ASC_ISSUER_ID: ${{ steps.apple.outputs.api_issuer_id }}
          ASC_KEY_B64: ${{ steps.apple.outputs.api_key_base64 }}
          BUNDLE_ID: ${{ steps.capacitor.outputs.bundle_id }}
          MANUAL_VERSION: ${{ inputs.version }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: node "$GITHUB_WORKSPACE/.wf/.github/scripts/autover.cjs"
      
      - name: Node
        id: node_version
        working-directory: app
        run: |
          if [ -f "package.json" ]; then
            CAP_VER=$(jq -r '.dependencies["@capacitor/core"] // .devDependencies["@capacitor/core"] // empty' package.json)
            if [ -z "$CAP_VER" ]; then
              NODE_VER="20"; MAJOR_VER="8"
            else
              MAJOR_VER=$(echo "$CAP_VER" | sed 's/[^0-9.]//g' | cut -d. -f1)
              if [ "$MAJOR_VER" -ge 8 ]; then NODE_VER="22"
              elif [ "$MAJOR_VER" -eq 7 ] || [ "$MAJOR_VER" -eq 6 ]; then NODE_VER="20"
              elif [ "$MAJOR_VER" -le 5 ]; then NODE_VER="18"; MAJOR_VER="5"
              else NODE_VER="20"; MAJOR_VER="8"; fi
            fi
          else
            NODE_VER="20"; MAJOR_VER="8"
          fi
          echo "version=$NODE_VER" >> $GITHUB_OUTPUT
          echo "capacitor_major=$MAJOR_VER" >> $GITHUB_OUTPUT
      
      - name: Detect
        id: features
        working-directory: app
        run: |
          HAS_RUST="false"
          RUST_ENGINE_DIR=""
          WASM_OUT_DIR=""
          if [ -d "rust" ]; then
            RUST_ENGINE_DIR=$(find rust -maxdepth 1 -type d ! -name rust | head -1)
            if [ -n "$RUST_ENGINE_DIR" ] && [ -f "$RUST_ENGINE_DIR/Cargo.toml" ]; then
              HAS_RUST="true"
              ENGINE_NAME=$(basename "$RUST_ENGINE_DIR" | sed 's/-wasm-engine//')
              WASM_OUT_DIR="src/wasm/${ENGINE_NAME}-engine"
            fi
          fi
          echo "has_rust=$HAS_RUST" >> $GITHUB_OUTPUT
          echo "rust_engine_dir=$RUST_ENGINE_DIR" >> $GITHUB_OUTPUT
          echo "wasm_out_dir=$WASM_OUT_DIR" >> $GITHUB_OUTPUT
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.version }}
      
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - name: Deps
        working-directory: app
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps 2>/dev/null || {
              rm -f package-lock.json
              npm install --legacy-peer-deps
            }
          else
            npm install --legacy-peer-deps
          fi
      
      - name: Cargo Cache
        if: steps.features.outputs.has_rust == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/${{ steps.features.outputs.rust_engine_dir }}/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/**/Cargo.lock', 'app/**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      
      - name: Rust
        if: steps.features.outputs.has_rust == 'true'
        run: |
          if command -v rustc &>/dev/null && command -v wasm-pack &>/dev/null; then
            rustc --version
            wasm-pack --version
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            cargo install wasm-pack
          fi

      - name: WASM
        if: steps.features.outputs.has_rust == 'true'
        working-directory: app
        run: |
          source $HOME/.cargo/env
          RUST_DIR="${{ steps.features.outputs.rust_engine_dir }}"
          WASM_OUT="${{ steps.features.outputs.wasm_out_dir }}"
          if [ -f "$RUST_DIR/Makefile" ]; then
            make -C "$RUST_DIR" build
          else
            wasm-pack build "$RUST_DIR" --target web --out-dir "../../$WASM_OUT" --release
          fi
      
      - name: Build
        working-directory: app
        run: ${{ inputs.npm_build_command }}
      
      - name: Sync
        working-directory: app
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
          TARGET: ${{ inputs.target_platform }}
        run: |
          WEB_DIR="${{ steps.capacitor.outputs.web_dir }}"
          if [ ! -d "$WEB_DIR" ]; then
            if [ -d "dist" ]; then mv dist "$WEB_DIR"
            elif [ -d "build" ]; then mv build "$WEB_DIR"
            elif [ -d "public" ]; then mv public "$WEB_DIR"
            else exit 1; fi
          fi
          NEEDS_CATALYST="false"
          if [ "$TARGET" == "all_devices" ] || [ "$TARGET" == "macos_only" ]; then
            NEEDS_CATALYST="true"
          fi
          USE_COCOAPODS="false"
          if [ "$CAP_MAJOR" -ge 8 ] && [ "$NEEDS_CATALYST" == "true" ]; then
            USE_COCOAPODS="true"
            if [ ! -d "ios" ]; then npx cap add ios --packagemanager cocoapods 2>/dev/null || npx cap add ios; fi
            npx cap sync ios --packagemanager cocoapods 2>/dev/null || npx cap sync ios
          else
            if [ ! -d "ios" ]; then npx cap add ios; fi
            npx cap sync ios
          fi
          echo "USE_COCOAPODS=$USE_COCOAPODS" >> $GITHUB_ENV
      
      - name: Preserve app native sources (pre-SPM-teardown)
        if: env.USE_COCOAPODS == 'true'
        working-directory: app/ios/App
        run: |
          set -euo pipefail
          SRC="CapApp-SPM/Sources/CapApp-SPM"
          if [ ! -d "$SRC" ]; then
            echo "::error::$SRC missing - cannot preserve app native sources"; exit 1
          fi
          mkdir -p App/Native
          for f in "$SRC"/*.swift; do
            base=$(basename "$f")
            [ "$base" = "CapApp-SPM.swift" ] && continue
            cp "$f" "App/Native/$base"
            echo "preserved: $base"
          done
          if [ -z "$(ls -A App/Native 2>/dev/null)" ]; then
            echo "::error::no app native sources were preserved"; exit 1
          fi
          /usr/bin/sed -i '' 's/customModule="CapApp_SPM"/customModule="App"/g' App/Base.lproj/Main.storyboard
          if grep -q 'customModule="CapApp_SPM"' App/Base.lproj/Main.storyboard; then
            echo "::error::storyboard still references CapApp_SPM"; exit 1
          fi
          /usr/bin/sed -i '' '/^import CapApp_SPM$/d' App/AppDelegate.swift
          gem install xcodeproj --no-document >/dev/null 2>&1 || true
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("App.xcodeproj")
          target = project.targets.find { |t| t.name == "App" }
          abort("App target not found") unless target
          group = project.main_group.find_subpath("App/Native", true)
          group.set_source_tree("SOURCE_ROOT")
          group.set_path("App/Native")
          added = 0
          Dir.glob("App/Native/*.swift").each do |path|
            name = File.basename(path)
            next if group.files.any? { |f| f.display_name == name }
            ref = group.new_reference(name)
            target.add_file_references([ref])
            added += 1
          end
          project.save
          puts "added #{added} app native source(s) to the App target"
          abort("no sources added to App target") if added.zero?
          '

      - name: SPM Clean
        if: env.USE_COCOAPODS == 'true'
        working-directory: app/ios/App
        run: |
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("App.xcodeproj")
          project.root_object.package_references.clear
          project.targets.each do |target|
            target.package_product_dependencies.clear
            target.dependencies.to_a.each do |dep|
              if dep.respond_to?(:product_ref) && dep.product_ref
                dep.remove_from_project
              end
            end
            bp = target.frameworks_build_phase
            next unless bp
            bp.files.to_a.each do |f|
              if f.respond_to?(:product_ref) && f.product_ref
                f.remove_from_project
              end
            end
          end
          project.main_group.recursive_children.each do |child|
            if child.respond_to?(:path) && child.path.to_s.include?("CapApp-SPM")
              child.remove_from_project rescue nil
            end
          end
          project.save
          '
          rm -rf CapApp-SPM
      
      - name: Verify app extensions survived
        working-directory: app/ios/App
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document >/dev/null 2>&1 || true
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("App.xcodeproj")
          names = project.targets.map(&:name)
          missing = ["IGCQuickLook", "IGCThumbnail"].reject { |n| names.include?(n) }
          abort("::error::app extension target(s) missing after project rewrite: #{missing.join(", ")} (have: #{names.join(", ")})") unless missing.empty?
          app = project.targets.find { |t| t.name == "App" }
          embed = app.build_phases.find { |ph|
            ph.is_a?(Xcodeproj::Project::Object::PBXCopyFilesBuildPhase) && ph.name == "Embed App Extensions"
          }
          abort("::error::Embed App Extensions build phase was removed") unless embed
          embedded = embed.files.map { |f| f.display_name }
          %w[IGCQuickLook.appex IGCThumbnail.appex].each do |a|
            abort("::error::#{a} is no longer embedded in the app") unless embedded.include?(a)
          end
          puts "app extensions intact: #{embedded.join(", ")}"
          '

      - name: AdMob
        working-directory: app
        run: |
          PLIST="ios/App/App/Info.plist"
          if [ ! -f "$PLIST" ]; then exit 0; fi
          GAD_ID=""
          if [ -f "capacitor.config.json" ]; then
            GAD_ID=$(jq -r '.plugins.AdMob.appId // empty' capacitor.config.json)
          fi
          if [ -z "$GAD_ID" ] && [ -f "capacitor.config.ts" ]; then
            GAD_ID=$(grep -oE "ca-app-pub-[0-9]+~[0-9]+" capacitor.config.ts | head -1 || true)
          fi
          if [ -z "$GAD_ID" ]; then exit 0; fi
          if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_ID" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_ID" "$PLIST"
          fi
      
      - name: RC Patch
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app
        run: |
          PLUGIN_FILE=$(find node_modules/@revenuecat/purchases-capacitor/ios -name "PurchasesPlugin.swift" 2>/dev/null | head -n 1)
          if [ -z "$PLUGIN_FILE" ] || [ ! -f "$PLUGIN_FILE" ]; then exit 0; fi
          if grep -q "#if !targetEnvironment(macCatalyst)" "$PLUGIN_FILE"; then exit 0; fi
          sed -i.bak 's/CommonFunctionality\.presentCodeRedemptionSheet()/#if !targetEnvironment(macCatalyst)\n            CommonFunctionality.presentCodeRedemptionSheet()\n            #else\n            \/\/ Not available on Mac Catalyst\n            call.reject("Not available on Mac Catalyst")\n            return\n            #endif/g' "$PLUGIN_FILE"

      - name: Geolocation Catalyst Patch
        if: (inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only') && inputs.repository_url == 'jauntyjsnew/GPXview'
        working-directory: app
        run: |
          GEO_DIR="node_modules/@capacitor/geolocation/ios/Sources/GeolocationPlugin"
          PLUGIN_FILE="$GEO_DIR/GeolocationPlugin.swift"
          CALLBACK_FILE="$GEO_DIR/GeolocationCallbackManager.swift"
          MODEL_FILE="$GEO_DIR/IONGLOCPositionModel+JSONTransformer.swift"
          if [ ! -f "$PLUGIN_FILE" ]; then exit 0; fi
          if grep -q "GPX_CATALYST_GEO_STUB" "$PLUGIN_FILE"; then exit 0; fi

          ORIG_PLUGIN=$(mktemp)
          ORIG_CALLBACK=$(mktemp)
          ORIG_MODEL=$(mktemp)
          cp "$PLUGIN_FILE" "$ORIG_PLUGIN"
          [ -f "$CALLBACK_FILE" ] && cp "$CALLBACK_FILE" "$ORIG_CALLBACK"
          [ -f "$MODEL_FILE" ] && cp "$MODEL_FILE" "$ORIG_MODEL"

          cat > "$PLUGIN_FILE" <<'SWIFT'
          #if targetEnvironment(macCatalyst)
          import Capacitor

          @objc(GeolocationPlugin)
          public class GeolocationPlugin: CAPPlugin, CAPBridgedPlugin {
              // GPX_CATALYST_GEO_STUB
              public let identifier = "GeolocationPlugin"
              public let jsName = "Geolocation"
              public let pluginMethods: [CAPPluginMethod] = [
                  .init(name: "getCurrentPosition", returnType: CAPPluginReturnPromise),
                  .init(name: "watchPosition", returnType: CAPPluginReturnCallback),
                  .init(name: "clearWatch", returnType: CAPPluginReturnPromise),
                  .init(name: "checkPermissions", returnType: CAPPluginReturnPromise),
                  .init(name: "requestPermissions", returnType: CAPPluginReturnPromise)
              ]

              @objc func getCurrentPosition(_ call: CAPPluginCall) { reject(call) }
              @objc func watchPosition(_ call: CAPPluginCall) { reject(call) }
              @objc func clearWatch(_ call: CAPPluginCall) { call.resolve() }

              @objc override public func checkPermissions(_ call: CAPPluginCall) {
                  call.resolve(["location": "denied", "coarseLocation": "denied"])
              }

              @objc override public func requestPermissions(_ call: CAPPluginCall) { reject(call) }

              private func reject(_ call: CAPPluginCall) {
                  call.reject("Geolocation is not available on Mac Catalyst.", "OS-PLUG-GLOC-0007")
              }
          }
          #else
          SWIFT
          cat "$ORIG_PLUGIN" >> "$PLUGIN_FILE"
          cat >> "$PLUGIN_FILE" <<'SWIFT'
          #endif
          SWIFT

          wrap_empty_for_catalyst() {
            TARGET_FILE="$1"
            ORIG_FILE="$2"
            [ -f "$TARGET_FILE" ] || return 0
            cat > "$TARGET_FILE" <<'SWIFT'
          #if targetEnvironment(macCatalyst)
          import Capacitor
          // GPX_CATALYST_GEO_STUB
          #else
          SWIFT
            cat "$ORIG_FILE" >> "$TARGET_FILE"
            cat >> "$TARGET_FILE" <<'SWIFT'
          #endif
          SWIFT
          }

          wrap_empty_for_catalyst "$CALLBACK_FILE" "$ORIG_CALLBACK"
          wrap_empty_for_catalyst "$MODEL_FILE" "$ORIG_MODEL"
      
      - name: Ruby
        run: |
          gem install fastlane
          gem install cocoapods
          gem install xcodeproj
      
      - name: iOS Target
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          if [ "$CAP_MAJOR" -ge 6 ]; then IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ]; then IOS_TARGET="13.0"
          else IOS_TARGET="15.0"; fi
          
          if [ -f "Podfile" ]; then
            sed -i.bak "s/platform :ios, '[0-9.]*'/platform :ios, '$IOS_TARGET'/g" Podfile
            rm -f Podfile.bak
          fi
          
          ruby -e "
          require 'xcodeproj'
          ios_target = '$IOS_TARGET'
          project = Xcodeproj::Project.open('App.xcodeproj')
          project.build_configurations.each do |config|
            config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ios_target
          end
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ios_target
            end
          end
          project.save
          "
          
          if [ -f "Podfile" ]; then pod install; fi
      
      - name: Catalyst
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
          cat <<EOF > enable_catalyst.rb
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          # EVERY target: an app extension embedded in a Catalyst app must
          # itself support Mac Catalyst or the archive refuses to link it.
          targets = project.targets
          exit(1) if targets.empty?
          targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['SUPPORTS_MACCATALYST'] = 'YES'
              config.build_settings['SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD'] = 'NO'
            end
          end
          project.save
          EOF
          ruby enable_catalyst.rb
      
      - name: Catalyst Pods
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          # ── Keep @capacitor/filesystem linkable for Mac ──────────────────
          # MEASURED 2026-07-27. @capacitor/filesystem v7+ depends on
          # IONFilesystemLib, which ships as a PREBUILT .xcframework whose
          # Info.plist carries exactly two slices: ios-arm64 and
          # ios-arm64_x86_64-simulator. There is no maccatalyst slice, so it can
          # never link into a Catalyst build — which is why this step used to
          # delete the pod outright. But deleting it does not remove the plugin
          # from packageClassList, so the app kept asking Capacitor for a class
          # that was not in the binary and every save died at runtime with
          # `"Filesystem" plugin is not implemented on ios` — on Mac AND in the
          # iOS ipa, because this job strips the SPM package and builds both
          # archives from these Pods. MHT Viewer shipped that way.
          #
          # v6 has no IONFilesystemLib: pure Swift, `import Capacitor` only. So
          # pin v6 here instead of amputating the feature. Verified end to end:
          # Mac Catalyst BUILD SUCCEEDED with CapacitorFilesystem.framework in
          # the bundle, and on a simulator `Filesystem.writeFile` returned a real
          # uri and the file was on disk. The JS API used across the portfolio
          # (writeFile/readFile/deleteFile/mkdir/readdir/stat + Directory,
          # Encoding) is identical in v6, and anything missing fails the TS build
          # loudly rather than at runtime.
          #
          # Safe here specifically: `cap sync` and `SPM Clean` have already run,
          # so nothing downstream resolves this package through SPM.
          if [ -f "../../node_modules/@capacitor/filesystem/package.json" ]; then
            FS_VER=$(node -p "require('../../node_modules/@capacitor/filesystem/package.json').version" 2>/dev/null || echo "")
            FS_MAJOR="${FS_VER%%.*}"
            if [ -n "$FS_MAJOR" ] && [ "$FS_MAJOR" -ge 7 ] 2>/dev/null; then
              echo "::notice::@capacitor/filesystem $FS_VER cannot link for Mac Catalyst (IONFilesystemLib.xcframework has no maccatalyst slice) — pinning v6 so the feature survives."
              (cd ../.. && npm install @capacitor/filesystem@^6.0.4 --legacy-peer-deps) || echo "::warning::filesystem downgrade failed — the pod will be stripped and the guard below will stop the build."
            fi
          fi

          if [ ! -f "Podfile" ]; then
            echo "platform :ios, '15.0'" > Podfile
            echo "target 'App' do" >> Podfile
            echo "  use_frameworks!" >> Podfile
            echo "  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'" >> Podfile
            echo "  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'" >> Podfile
            CAPS=$(find ../../node_modules -name "*.podspec" -path "*capacitor*" -o -name "*.podspec" -path "*revenuecat*" 2>/dev/null)
            for spec in $CAPS; do
              POD_DIR=$(dirname "$spec")
              POD_NAME=$(basename "$spec" .podspec)
              if [ "$POD_NAME" != "Capacitor" ] && [ "$POD_NAME" != "CapacitorCordova" ]; then
                echo "  pod '$POD_NAME', :path => '$POD_DIR'" >> Podfile
              fi
            done
            echo "end" >> Podfile
            pod install || pod install --repo-update
          fi
          
          # Only amputate Filesystem if the pin above did not take effect — a v6
          # podspec has no IONFilesystemLib dependency and links fine.
          if grep -qs "IONFilesystemLib" ../../node_modules/@capacitor/filesystem/CapacitorFilesystem.podspec; then
            echo "::warning::stripping CapacitorFilesystem — every Filesystem call in this binary will fail at runtime."
            sed -i.bak '/IONFilesystemLib/d' Podfile
            sed -i.bak '/CapacitorFilesystem/d' Podfile
          fi
          sed -i.bak '/Google-Mobile-Ads-SDK/d' Podfile
          sed -i.bak '/GoogleUserMessagingPlatform/d' Podfile
          sed -i.bak '/CapacitorCommunityAdmob/d' Podfile
          rm -f Podfile.bak
          
          if grep -q "post_install" Podfile; then
            sed -i.bak '/^post_install/,/^end$/d' Podfile
            rm -f Podfile.bak
          fi
          
          # IPHONEOS_DEPLOYMENT_TARGET belongs in post_install, not only in the
          # `Pods Target` step below. MEASURED 2026-07-28 (GPXview run
          # 30367343655): a later `pod install` — the one inside Build App's
          # prepare_geolocation_for_catalyst — regenerates Pods.xcodeproj and
          # throws away everything that step wrote, so every pod falls back to
          # its own podspec minimum. @capacitor/filesystem 6.0.4 declares
          # `s.ios.deployment_target = '13.0'`, which for Catalyst becomes
          # ios13.1-macabi, and at that target Xcode 26.6 does not emit an
          # error — swift-frontend CRASHES type-checking Filesystem.swift:253
          # (`Assertion failed: (inserted), addFix, ConstraintSystem.cpp:350`)
          # and the Mac archive dies. Reproduced locally both ways: the same
          # pod builds clean at ios15.0-macabi and crashes at ios13.1-macabi.
          # Setting it here makes it survive any number of later pod installs.
          # CODE_SIGN_STYLE is here for the same reason — `Pods Sign` writes it
          # into the project and that later pod install would drop it.
          if [ "$CAP_MAJOR" -ge 6 ] 2>/dev/null; then IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ] 2>/dev/null; then IOS_TARGET="13.0"
          else IOS_TARGET="15.0"; fi

          echo '' >> Podfile
          echo 'post_install do |installer|' >> Podfile
          echo '  installer.pods_project.targets.each do |target|' >> Podfile
          echo '    target.build_configurations.each do |config|' >> Podfile
          echo '      config.build_settings["SUPPORTS_MACCATALYST"] = "YES"' >> Podfile
          echo "      config.build_settings[\"IPHONEOS_DEPLOYMENT_TARGET\"] = \"$IOS_TARGET\"" >> Podfile
          echo '      config.build_settings["CODE_SIGN_IDENTITY"] = ""' >> Podfile
          echo '      config.build_settings["CODE_SIGN_STYLE"] = "Manual"' >> Podfile
          echo '      config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"' >> Podfile
          echo '      config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"' >> Podfile
          echo '    end' >> Podfile
          echo '  end' >> Podfile
          echo 'end' >> Podfile

          pod install
      
      - name: Stripped Plugin Guard
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app
        run: |
          # Last line of defence for the failure mode that cost real money twice:
          # a pod this job removed, whose JS the app still calls. `cap sync` leaves
          # the plugin in packageClassList either way, so the app asks Capacitor
          # for a class that is not in the binary and every call fails at runtime
          # with `"X" plugin is not implemented on ios` — in a paid feature, with
          # nothing in the build log, on Mac AND in the iOS ipa.
          #
          # Ask the only question that matters: does src/ import a package whose
          # pod is missing from the Podfile we are about to build? That stays
          # correct as the Podfile changes — when the v6 pin above works,
          # CapacitorFilesystem is present and this passes.
          #
          # A file whose import is a browser-only fallback (native path goes
          # through the app's own plugin) opts out with a MAC-STRIPPED-OK comment
          # — see mht-viewer-converter src/lib/cache-file.ts.
          PODFILE="ios/App/Podfile"
          [ -f "$PODFILE" ] || exit 0
          FAIL=0
          check() {
            NPM_PKG="$1"; POD_NAME="$2"
            grep -qs "pod '$POD_NAME'" "$PODFILE" && return 0
            OFFENDERS=""
            for f in $(grep -rls --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --include="*.vue" "$NPM_PKG" src/ 2>/dev/null); do
              grep -q "MAC-STRIPPED-OK" "$f" || OFFENDERS="$OFFENDERS $f"
            done
            [ -z "$OFFENDERS" ] && return 0
            echo "::error::$NPM_PKG is imported by src/ but $POD_NAME is not in the Podfile for this build, so the binary ships WITHOUT it and every call fails at runtime with '\"plugin is not implemented on ios\"' — on Mac and on iPhone. Offending files:$OFFENDERS"
            FAIL=1
          }
          check "@capacitor/filesystem" "CapacitorFilesystem"
          check "@capacitor-community/admob" "CapacitorCommunityAdmob"
          if [ "$FAIL" = "1" ]; then
            if [ "${{ inputs.allow_stripped_plugins }}" = "true" ]; then
              echo "::warning::allow_stripped_plugins is set — shipping with the feature above dead on every platform."
            else
              echo "Fix options: (a) let the v6 pin work, (b) write through your own native plugin method (pattern: mht-viewer-converter MHTEnginePlugin.writeCacheFile + src/lib/cache-file.ts), (c) build this app without Mac, or (d) re-run with allow_stripped_plugins to ship the feature dead."
              exit 1
            fi
          fi
      
      - name: Pods Target
        working-directory: app/ios/App
        env:
          CAP_MAJOR: ${{ steps.node_version.outputs.capacitor_major }}
        run: |
          if [ "$CAP_MAJOR" -ge 6 ]; then export IOS_TARGET="15.0"
          elif [ "$CAP_MAJOR" -eq 5 ]; then export IOS_TARGET="13.0"
          else export IOS_TARGET="15.0"; fi
          
          if [ ! -d "Pods/Pods.xcodeproj" ]; then exit 0; fi
          
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = ENV['IOS_TARGET'] || '15.0'
            end
          end
          project.save
          "

      - name: Pods Sign
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        run: |
          if [ ! -d "Pods/Pods.xcodeproj" ]; then exit 0; fi
          ruby -e '
          require "xcodeproj"
          project = Xcodeproj::Project.open("Pods/Pods.xcodeproj")
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_IDENTITY"] = ""
              config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
              config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
            end
          end
          project.save
          '
      
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Cert
        id: cert
        env:
          CERT_B64: ${{ steps.apple.outputs.certificate_base64 }}
          CERT_PASS: ${{ steps.apple.outputs.certificate_password }}
          INST_CERT_B64: ${{ steps.apple.outputs.installer_certificate_base64 }}
          INST_CERT_PASS: ${{ steps.apple.outputs.installer_certificate_password }}
          APPLE_TEAM_ID: ${{ steps.apple.outputs.team_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          
          echo "$CERT_B64" | base64 --decode > $CERT_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          INSTALLER_CERT_NAME=""
          if [ -n "$INST_CERT_B64" ]; then
            echo "$INST_CERT_B64" | base64 --decode > $INSTALLER_CERT_PATH
            security import $INSTALLER_CERT_PATH -P "$INST_CERT_PASS" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            INSTALLER_CERT_NAME=$(security find-identity -v -p basic $KEYCHAIN_PATH | grep "3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            if [ -n "$INSTALLER_CERT_NAME" ]; then
              echo "::add-mask::$INSTALLER_CERT_NAME"
            else
              INSTALLER_CERT_NAME="3rd Party Mac Developer Installer: $APPLE_TEAM_ID"
            fi
          fi
          
          echo "installer_cert_name=$INSTALLER_CERT_NAME" >> $GITHUB_OUTPUT
          security list-keychain -d user -s $KEYCHAIN_PATH
      
      - name: iOS Profile
        id: provision
        if: inputs.provisioning_profile_base64 != ''
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "${{ inputs.provisioning_profile_base64 }}" | base64 --decode > $PP_PATH
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "::add-mask::$UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "uuid=$UUID" >> $GITHUB_OUTPUT
      
      - name: Mac Profile
        id: mac_provision
        if: (inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only') && inputs.mac_provisioning_profile_base64 != ''
        run: |
          MAC_PP_PATH=$RUNNER_TEMP/mac_profile.provisionprofile
          echo "${{ inputs.mac_provisioning_profile_base64 }}" | base64 --decode > $MAC_PP_PATH
          MAC_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $MAC_PP_PATH))
          echo "::add-mask::$MAC_UUID"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $MAC_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$MAC_UUID.provisionprofile
          echo "uuid=$MAC_UUID" >> $GITHUB_OUTPUT
      
      - name: Version
        working-directory: app/ios/App
        run: |
          BUILD_NUM=$(date -u +"%Y%m%d%H%M")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.autover.outputs.version }}" App/Info.plist
      
      - name: Display Name
        working-directory: app
        run: |
          APP_NAME="${{ steps.capacitor.outputs.app_name }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" ios/App/App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string $APP_NAME" ios/App/App/Info.plist
      
      - name: Mac Plist
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" App/Info.plist 2>/dev/null || true
          MAC_CAT="${{ inputs.mac_category }}"
          if [ -z "$MAC_CAT" ]; then MAC_CAT="public.app-category.utilities"; fi
          /usr/libexec/PlistBuddy -c "Set :LSApplicationCategoryType $MAC_CAT" App/Info.plist 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :LSApplicationCategoryType string $MAC_CAT" App/Info.plist
      
      - name: Entitlements
        if: inputs.target_platform == 'all_devices' || inputs.target_platform == 'macos_only'
        working-directory: app/ios/App
        run: |
              if [ ! -f "App/App.entitlements" ]; then
                cat <<EOF > App/App.entitlements
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>com.apple.security.app-sandbox</key>
                <true/>
                <key>com.apple.security.network.client</key>
                <true/>
                <key>com.apple.security.files.user-selected.read-write</key>
                <true/>
              </dict>
              </plist>
              EOF
              else
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.app-sandbox bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox true" "App/App.entitlements"
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "App/App.entitlements"
                # read-WRITE, not read-only. MEASURED 2026-07-29 on a minimal Mac
                # Catalyst app, three signed variants: with only
                # files.user-selected.read-only, AppKit REFUSES to open the panel at
                # all -- "your app has the User Selected File Read entitlement but it
                # needs User Selected File Read/Write to display save panels" -- the
                # UIDocumentPickerViewController(forExporting:asCopy:true) delegate is
                # then NEVER called, so the app hangs on Save with nothing in any log
                # the user or we can see. The same app with read-write wrote the file
                # to disk; so did the unsandboxed control. asCopy:true does NOT make
                # this a read-only operation -- the system still gates the panel on the
                # write entitlement. Every app that saves on Mac through
                # rushPresentCatalystSaveDialog depends on this line.
                # Drop a stale read-only key first: a leftover one is what AppKit sees.
                /usr/libexec/PlistBuddy -c "Delete :com.apple.security.files.user-selected.read-only" "App/App.entitlements" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.files.user-selected.read-write bool true" "App/App.entitlements" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :com.apple.security.files.user-selected.read-write true" "App/App.entitlements"
              fi
              
              cat <<EOF > link_entitlements.rb
              require 'xcodeproj'
              project = Xcodeproj::Project.open('App.xcodeproj')
              targets = project.targets.select { |t| t.name == 'App' }
              targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
                end
              end
              project.save
              EOF
              ruby link_entitlements.rb
              rm link_entitlements.rb
      
      - name: Platform
        working-directory: app/ios/App
        run: |
          IS_CATALYST="false"
          case "${{ inputs.target_platform }}" in
            "iphone_only") DESTINATION="generic/platform=iOS Simulator"; DEVICES="1" ;;
            "ipad_only") DESTINATION="generic/platform=iOS Simulator"; DEVICES="2" ;;
            "iphone_and_ipad") DESTINATION="generic/platform=iOS Simulator"; DEVICES="1,2" ;;
            "macos_only") DESTINATION="generic/platform=macOS,variant=Mac Catalyst"; DEVICES="1,2"; IS_CATALYST="true" ;;
            *) DESTINATION="generic/platform=macOS,variant=Mac Catalyst"; DEVICES="1,2"; IS_CATALYST="true" ;;
          esac
          
          if [ "${{ inputs.build_mode }}" == "build_only" ]; then
            CODE_SIGN_IDENTITY="-"; CODE_SIGNING_REQUIRED="NO"; CODE_SIGNING_ALLOWED="NO"
          else
            CODE_SIGN_IDENTITY="Apple Distribution"; CODE_SIGNING_REQUIRED="YES"; CODE_SIGNING_ALLOWED="YES"
          fi
          
          TEAM_ID="${{ steps.apple.outputs.team_id }}"
          APP_NAME_SAFE=$(echo "${{ steps.capacitor.outputs.app_name }}" | tr ' ' '-')
          
          echo "DESTINATION=$DESTINATION" >> $GITHUB_ENV
          echo "TARGET_DEVICES=$DEVICES" >> $GITHUB_ENV
          echo "IS_CATALYST=$IS_CATALYST" >> $GITHUB_ENV
          echo "CODE_SIGN_IDENTITY=$CODE_SIGN_IDENTITY" >> $GITHUB_ENV
          echo "CODE_SIGNING_REQUIRED=$CODE_SIGNING_REQUIRED" >> $GITHUB_ENV
          echo "CODE_SIGNING_ALLOWED=$CODE_SIGNING_ALLOWED" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "APP_NAME_SAFE=$APP_NAME_SAFE" >> $GITHUB_ENV
      
      # ─── Provisioning for the app extensions ──────────────────────────
      # r.yml signs exactly one bundle id, with the profile pasted into the
      # dispatch inputs. This app adds two more — the Quick Look preview and the
      # thumbnail provider each get their own bundle id — and nothing has ever
      # created profiles for those. Rather than making every release of this one
      # app paste four extra base64 blobs, the App Store Connect API key that is
      # already here for the upload creates the identifiers and the App Store
      # profiles itself. Idempotent: an identifier that exists is reused, and a
      # valid profile is downloaded rather than regenerated.
      - name: Extension Profiles
        id: ext_profiles
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        run: |
          set -uo pipefail
          BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
          APP_IOS_UUID="${{ steps.provision.outputs.uuid }}"
          APP_MAC_UUID="${{ steps.mac_provision.outputs.uuid }}"
          gem install xcodeproj --no-document >/dev/null 2>&1 || true
          MAP=$(ruby -e '
            require "xcodeproj"
            require "json"
            project = Xcodeproj::Project.open("App.xcodeproj")
            out = {}
            project.targets.each do |t|
              next if t.name == "App"
              next unless t.respond_to?(:product_type) && t.product_type.to_s.include?("app-extension")
              cfg = t.build_configurations.find { |c| c.name == "Release" } || t.build_configurations.first
              id = cfg && cfg.build_settings["PRODUCT_BUNDLE_IDENTIFIER"]
              out[t.name] = id if id && !id.to_s.empty?
            end
            print out.to_json
          ')
          echo "extension targets: $MAP"

          API_KEY_CONTENT=$(echo "${{ steps.apple.outputs.api_key_base64 }}" | base64 --decode)
          API_KEY_PATH="$RUNNER_TEMP/ext_api_key.json"
          jq -n --arg key_id "${{ steps.apple.outputs.api_key_id }}" \
                --arg issuer_id "${{ steps.apple.outputs.api_issuer_id }}" \
                --arg key "$API_KEY_CONTENT" \
                '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_PATH"
          echo "$API_KEY_CONTENT" > "$RUNNER_TEMP/ext_key.p8"
          export SPACESHIP_SKIP_2FA_UPGRADE=1
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          NEED_MAC=false
          if [ "${{ inputs.target_platform }}" = "all_devices" ] || [ "${{ inputs.target_platform }}" = "macos_only" ]; then
            NEED_MAC=true
          fi

          # ── The app's own profile ──────────────────────────────────────
          # Pasting two base64 blobs into every dispatch of every app is the
          # one manual step left in this pipeline, and it is the step that most
          # often gets forgotten — five runs of this app failed with
          # '"App" requires a provisioning profile' for exactly that reason.
          # The same API key that provisions the extensions can download the
          # app's App Store profile too, so the blobs are now an OVERRIDE
          # rather than a requirement: paste one and it wins, paste nothing and
          # it is fetched. Existing apps are unaffected either way.
          fetch_profile() {
            local IDENT="$1" PLAT="$2" OUT_BASE="$3"
            fastlane run get_provisioning_profile \
              api_key_path:"$API_KEY_PATH" \
              app_identifier:"$IDENT" platform:"$PLAT" \
              team_id:"${{ steps.apple.outputs.team_id }}" \
              skip_install:true \
              output_path:"$RUNNER_TEMP" filename:"$OUT_BASE" \
              2>&1 | tee "$RUNNER_TEMP/sigh.log" | tail -6
          }
          # Sets INSTALLED_UUID rather than printing it. Returning the uuid on
          # stdout swallowed the ::add-mask:: line into the same capture, so the
          # caller got two lines and GITHUB_OUTPUT rejected the multi-line value
          # ("Invalid format"). A mask directive only counts on stdout, so it
          # cannot be moved to stderr either.
          install_profile() {
            local FILE="$1" PLAT="$2"
            INSTALLED_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$FILE"))
            echo "::add-mask::$INSTALLED_UUID"
            if [ "$PLAT" = "macos" ]; then
              cp "$FILE" ~/Library/MobileDevice/Provisioning\ Profiles/$INSTALLED_UUID.provisionprofile
            else
              cp "$FILE" ~/Library/MobileDevice/Provisioning\ Profiles/$INSTALLED_UUID.mobileprovision
            fi
          }

          if [ -z "$APP_IOS_UUID" ]; then
            echo "── app iOS profile (none pasted, fetching) ──"
            if ! fetch_profile "$BUNDLE_ID" ios "App_ios.mobileprovision"; then
              echo "::error::could not obtain the app's iOS App Store profile - see the fastlane error above"; exit 1
            fi
            install_profile "$RUNNER_TEMP/App_ios.mobileprovision" ios
            APP_IOS_UUID="$INSTALLED_UUID"
            echo "  app iOS profile ready"
          else
            echo "── app iOS profile supplied in the dispatch inputs ──"
          fi

          if [ "$NEED_MAC" = "true" ] && [ -z "$APP_MAC_UUID" ]; then
            echo "── app Mac profile (none pasted, fetching) ──"
            # "catalyst", not "macos": Apple issues Mac Catalyst App Store
            # profiles as their own type and exportArchive rejects a plain Mac
            # App Store profile with 'is not a "Mac Catalyst App Store" profile'.
            if ! fetch_profile "$BUNDLE_ID" catalyst "App_macos.mobileprovision"; then
              echo "::error::could not obtain the app's Mac App Store profile - see the fastlane error above"; exit 1
            fi
            install_profile "$RUNNER_TEMP/App_macos.mobileprovision" macos
            APP_MAC_UUID="$INSTALLED_UUID"
            echo "  app Mac profile ready"
          elif [ "$NEED_MAC" = "true" ]; then
            echo "── app Mac profile supplied in the dispatch inputs ──"
          fi
          echo "app_ios_uuid=$APP_IOS_UUID" >> $GITHUB_OUTPUT
          echo "app_mac_uuid=$APP_MAC_UUID" >> $GITHUB_OUTPUT

          if [ "$MAP" = "{}" ] || [ -z "$MAP" ]; then
            echo "no app extensions"
            echo "map={}" >> $GITHUB_OUTPUT
            exit 0
          fi

          RESULT='{}'
          for TARGET in $(echo "$MAP" | jq -r 'keys[]'); do
            EXT_ID=$(echo "$MAP" | jq -r --arg t "$TARGET" '.[$t]')
            echo "── $TARGET ($EXT_ID) ──"

            # Developer Portal identifier, via the Connect API directly.
            # `produce` cannot do this: its option list has no api_key_path at
            # all — it authenticates with a username and password, which this
            # pipeline deliberately does not have. Spaceship's Connect API
            # client does accept the key, so the bundle id is created with that.
            # UNIVERSAL because the same identifier has to serve the iOS build
            # and the Mac Catalyst one.
            if ! EXT_ID="$EXT_ID" EXT_NAME="$TARGET" \
                 API_KEY_ID="${{ steps.apple.outputs.api_key_id }}" \
                 API_ISSUER="${{ steps.apple.outputs.api_issuer_id }}" \
                 API_P8="$RUNNER_TEMP/ext_key.p8" \
                 ruby -e '
                   require "spaceship"
                   token = Spaceship::ConnectAPI::Token.create(
                     key_id: ENV["API_KEY_ID"],
                     issuer_id: ENV["API_ISSUER"],
                     filepath: ENV["API_P8"],
                   )
                   Spaceship::ConnectAPI.token = token
                   id = ENV["EXT_ID"]
                   found = (Spaceship::ConnectAPI::BundleId.find(id) rescue nil)
                   found ||= (Spaceship::ConnectAPI::BundleId.all.find { |b| b.identifier == id } rescue nil)
                   if found
                     puts "identifier exists: #{id}"
                   else
                     # The constant moved between fastlane versions - Platform
                     # in some, BundleIdPlatform in others - and the API itself
                     # only wants the string.
                     plat = begin
                       Spaceship::ConnectAPI::BundleIdPlatform::UNIVERSAL
                     rescue NameError
                       begin
                         Spaceship::ConnectAPI::Platform::UNIVERSAL
                       rescue NameError
                         "UNIVERSAL"
                       end
                     end
                     Spaceship::ConnectAPI::BundleId.create(
                       name: ENV["EXT_NAME"], identifier: id, platform: plat,
                     )
                     puts "identifier created: #{id}"
                   end
                 '; then
              echo "::error::could not create the App ID $EXT_ID - see the ruby error immediately above. If it mentions FORBIDDEN or authentication, the App Store Connect API key needs the Admin or App Manager role; anything else is a bug in this step, not a permissions problem."
              exit 1
            fi

            for PLAT in ios macos; do
              if [ "$PLAT" = "macos" ] && [ "$NEED_MAC" != "true" ]; then continue; fi
              # filename must be a BARE name: sigh joins it onto the working
              # directory, so an absolute path lands at app/ios/App/Users/... —
              # the profile downloads fine and then cannot be found. The
              # directory goes in output_path instead.
              EXT_BASENAME="${TARGET}_${PLAT}.mobileprovision"
              EXT_FILE="$RUNNER_TEMP/$EXT_BASENAME"
              # Neither force nor readonly is passed. fastlane run marshals
              # booleans as strings, so even force:false counts as "given" and
              # collides with readonly ("You can't enable both"). The defaults
              # are already what a hundred-app pipeline wants: download an
              # existing valid profile, mint one only when there is none or it
              # has expired. First release creates, every release after reuses,
              # and nothing accumulates against Apple's per-account limit.
              # Same reason as the app's Mac profile above.
              SIGH_PLAT="$PLAT"
              [ "$PLAT" = "macos" ] && SIGH_PLAT="catalyst"
              if ! fastlane run get_provisioning_profile \
                    api_key_path:"$API_KEY_PATH" \
                    app_identifier:"$EXT_ID" platform:"$SIGH_PLAT" \
                    team_id:"${{ steps.apple.outputs.team_id }}" \
                    skip_install:true \
                    output_path:"$RUNNER_TEMP" filename:"$EXT_BASENAME" \
                    2>&1 | tee "$RUNNER_TEMP/sigh.log" | tail -6; then
                echo "::error::could not obtain an App Store profile for $EXT_ID ($PLAT) - read the fastlane error just above. Only if it mentions FORBIDDEN or authentication does the App Store Connect API key need a wider role."
                exit 1
              fi
              if [ ! -f "$EXT_FILE" ]; then
                EXT_FILE=$(find "$RUNNER_TEMP" . -name "$EXT_BASENAME" -type f 2>/dev/null | head -1)
              fi
              if [ ! -f "$EXT_FILE" ]; then
                echo "::error::profile for $EXT_ID ($PLAT) was not written"; exit 1
              fi
              EXT_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$EXT_FILE"))
              echo "::add-mask::$EXT_UUID"
              if [ "$PLAT" = "macos" ]; then
                cp "$EXT_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/$EXT_UUID.provisionprofile
              else
                cp "$EXT_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/$EXT_UUID.mobileprovision
              fi
              RESULT=$(echo "$RESULT" | jq --arg t "$TARGET" --arg p "$PLAT" --arg u "$EXT_UUID" --arg b "$EXT_ID" \
                '.[$t] = ((.[$t] // {}) + {($p): $u, "bundle_id": $b})')
              if grep -qi "Creating new provisioning profile" "$RUNNER_TEMP/sigh.log" 2>/dev/null; then
                echo "  $PLAT: profile created"
              else
                echo "  $PLAT: existing profile reused"
              fi
            done
          done
          echo "map=$(echo "$RESULT" | jq -c .)" >> $GITHUB_OUTPUT
          echo "provisioned: $(echo "$RESULT" | jq -r 'keys | join(", ")')"

      - name: Manual Sign
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        env:
          # Pasted blob wins; otherwise the one Extension Profiles fetched.
          PROFILE_UUID: ${{ steps.provision.outputs.uuid || steps.ext_profiles.outputs.app_ios_uuid }}
          PROFILE_UUID_MAC: ${{ steps.mac_provision.outputs.uuid || steps.ext_profiles.outputs.app_mac_uuid }}
        run: |
          # A provisioning profile is valid for exactly one App ID. The profile
          # this workflow is handed belongs to the APP; each app extension has
          # its own bundle id and cannot use it. Extensions therefore go to
          # automatic signing and Xcode mints their profiles from the App Store
          # Connect API key already present for the upload. Projects with no
          # extensions take exactly the path they took before.
          cat > sign_targets.rb <<'RUBY'
          require 'xcodeproj'
          require 'json'
          project = Xcodeproj::Project.open('App.xcodeproj')
          team = ENV['TEAM_ID']
          EXT_MAP = JSON.parse(ENV['EXT_MAP'] || '{}')
          ext_targets = []
          project.targets.each do |target|
            is_app = target.name == 'App'
            target.build_configurations.each do |config|
              config.build_settings['DEVELOPMENT_TEAM'] = team
              if is_app
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
                if ENV['PROFILE_UUID'] && !ENV['PROFILE_UUID'].empty?
                  config.build_settings['PROVISIONING_PROFILE'] = ENV['PROFILE_UUID']
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                end
                if ENV['PROFILE_UUID_MAC'] && !ENV['PROFILE_UUID_MAC'].empty?
                  config.build_settings['PROVISIONING_PROFILE[sdk=macosx*]'] = ENV['PROFILE_UUID_MAC']
                end
              else
                # Manual, exactly like the app — automatic signing cannot be told
                # to use a distribution profile (it resolves development and then
                # rejects an explicit Apple Distribution identity as conflicting),
                # and it needs registered devices CI does not have. The profiles
                # were created by the Extension Profiles step above.
                ext = EXT_MAP[target.name]
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
                config.build_settings['DEVELOPMENT_TEAM'] = team
                if ext && ext['ios']
                  config.build_settings['PROVISIONING_PROFILE'] = ext['ios']
                  config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
                end
                if ext && ext['macos']
                  config.build_settings['PROVISIONING_PROFILE[sdk=macosx*]'] = ext['macos']
                end
              end
            end
            ext_targets << target.name unless is_app
          end
          project.save
          File.write(ENV['GITHUB_ENV'], "EXT_TARGETS=#{ext_targets.join(',')}\n", mode: 'a')
          puts ext_targets.empty? ? 'no app extensions' : "extensions on automatic signing: #{ext_targets.join(', ')}"
          RUBY
          TEAM_ID='${{ steps.apple.outputs.team_id }}' \
          EXT_MAP='${{ steps.ext_profiles.outputs.map }}' \
            ruby sign_targets.rb
          rm sign_targets.rb

      - name: Build App
        working-directory: app/ios/App
        run: |
          set -o pipefail
          if [ -d "App.xcworkspace" ]; then
            XC_ARG="-workspace App.xcworkspace"
            FL_ARG="workspace:App.xcworkspace"
          elif [ -d "App.xcodeproj" ]; then
            XC_ARG="-project App.xcodeproj"
            FL_ARG="project:App.xcodeproj"
          else
            exit 1
          fi

          prepare_geolocation_for_catalyst() {
            if [ "${{ inputs.repository_url }}" != "jauntyjsnew/GPXview" ]; then return 0; fi
            GEO_PODSPEC="../../node_modules/@capacitor/geolocation/CapacitorGeolocation.podspec"
            if [ -f "$GEO_PODSPEC" ] && grep -q "IONGeolocationLib" "$GEO_PODSPEC"; then
              sed -i.bak "/IONGeolocationLib/d" "$GEO_PODSPEC"
              rm -f "$GEO_PODSPEC.bak"
              # This pod install regenerates Pods.xcodeproj and discards what
              # the `Pods Target` / `Pods Sign` steps wrote into it. That is why
              # deployment target and signing style now live in the Podfile's
              # post_install (see `Catalyst Pods`) — do not move them back.
              if [ -f "Podfile" ]; then pod install; fi
            fi
          }

          if [ "${{ inputs.build_mode }}" == "build_only" ]; then
            
          if [ "${{ inputs.target_platform }}" == "all_devices" ]; then
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "generic/platform=iOS Simulator" \
                -derivedDataPath build-simulator \
                CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
                2>&1 | tee build-ios.log
              
              APP_PATH=$(find build-simulator -name "*.app" -type d | head -1)
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}-iOS-Simulator.app"
              zip -r "${APP_NAME_SAFE}-iOS-Simulator.app.zip" "${APP_NAME_SAFE}-iOS-Simulator.app"

              prepare_geolocation_for_catalyst
              
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "generic/platform=macOS,variant=Mac Catalyst" \
                -derivedDataPath build-macos \
                SUPPORTS_MACCATALYST=YES CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
                2>&1 | tee build-mac.log
              
              APP_PATH=$(find build-macos -name "*.app" -type d | head -1)
              find "$APP_PATH/Contents/Frameworks" -name "*.framework" -maxdepth 1 | while read fw; do
                codesign --force --sign - --timestamp=none --generate-entitlement-der "$fw" 2>/dev/null || true
              done
              find "$APP_PATH/Contents/Frameworks" -name "*.dylib" | while read dl; do
                codesign --force --sign - --timestamp=none "$dl" 2>/dev/null || true
              done
              codesign --force --sign - --deep --timestamp=none --generate-entitlement-der "$APP_PATH" 2>/dev/null || true
              
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}-macOS.app"
              zip -r "${APP_NAME_SAFE}-macOS.app.zip" "${APP_NAME_SAFE}-macOS.app"
              
            elif [ "$IS_CATALYST" == "true" ]; then
              prepare_geolocation_for_catalyst

              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "$DESTINATION" \
                -derivedDataPath build \
                SUPPORTS_MACCATALYST=YES DEVELOPMENT_TEAM="$TEAM_ID" \
                CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" CODE_SIGNING_ALLOWED="YES" \
                2>&1 | tee build.log
              
              APP_PATH=$(find build -name "*.app" -type d | head -1)
              if [ "${{ inputs.build_mode }}" == "build_only" ]; then
                find "$APP_PATH/Contents/Frameworks" -name "*.framework" -maxdepth 1 | while read fw; do
                  codesign --force --sign - --timestamp=none --generate-entitlement-der "$fw" 2>/dev/null || true
                done
                find "$APP_PATH/Contents/Frameworks" -name "*.dylib" | while read dl; do
                  codesign --force --sign - --timestamp=none "$dl" 2>/dev/null || true
                done
                codesign --force --sign - --deep --timestamp=none --generate-entitlement-der "$APP_PATH" 2>/dev/null || true
              fi
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}.app"
              zip -r "${APP_NAME_SAFE}.app.zip" "${APP_NAME_SAFE}.app"
              
            else
              xcodebuild $XC_ARG \
                -scheme App -configuration Release \
                -destination "$DESTINATION" \
                -derivedDataPath build \
                DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
                CODE_SIGNING_REQUIRED="$CODE_SIGNING_REQUIRED" CODE_SIGNING_ALLOWED="$CODE_SIGNING_ALLOWED" \
                2>&1 | tee build.log
              
              APP_PATH=$(find build -name "*.app" -type d | head -1)
              cp -R "$APP_PATH" "./${APP_NAME_SAFE}.app"
              zip -r "${APP_NAME_SAFE}.app.zip" "${APP_NAME_SAFE}.app"
            fi
            
          else
            TEAM_ID="${{ steps.apple.outputs.team_id }}"
            XCARGS="DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES"
            export FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT=120
            export FASTLANE_XCODEBUILD_SETTINGS_RETRIES=6
            
            EXT_MAP_JSON='${{ steps.ext_profiles.outputs.map }}'
            # Defined here, not inside the Mac branch: the iOS export runs
            # first and was building its profile map with an empty key,
            # which Xcode rejects as a malformed export options plist.
            BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
            # Both exports need a profile named for EVERY bundle id in the
            # archive. The app's comes from the dispatch input or is fetched;
            # the extensions' were created by the Extension Profiles step.
            # Built as JSON and converted by plutil rather than echoed as XML:
            # hand-written plists fail with "isn't in the correct format" and
            # give no clue which line was wrong.
            write_export_options() {
              local PLAT="$1" APP_UUID="$2" OUT="$3"
              local PROFILES
              if [ -z "$BUNDLE_ID" ]; then
                echo "::error::BUNDLE_ID is empty - the export map would carry a blank key"; exit 1
              fi
              if [ -z "$APP_UUID" ]; then
                echo "::error::no profile uuid for the app ($PLAT)"; exit 1
              fi
              PROFILES=$(jq -n --arg b "$BUNDLE_ID" --arg u "$APP_UUID" '{($b): $u}')
              if [ -n "${EXT_MAP_JSON:-}" ] && [ "$EXT_MAP_JSON" != "{}" ]; then
                PROFILES=$(echo "$EXT_MAP_JSON" | jq --argjson base "$PROFILES" --arg p "$PLAT" \
                  'reduce (to_entries[] | select(.value[$p] != null)) as $e
                     ($base; .[$e.value.bundle_id] = $e.value[$p])')
              fi
              local EXTRA='{}'
              if [ "$PLAT" = "macos" ]; then EXTRA='{"destination":"export"}'; fi
              jq -n --arg t "$TEAM_ID" --argjson pp "$PROFILES" --argjson x "$EXTRA" \
                '{method:"app-store", teamID:$t, signingStyle:"manual",
                  provisioningProfiles:$pp} + $x' \
                | plutil -convert xml1 -o "$OUT" -
              if ! plutil -lint "$OUT" >/dev/null; then
                echo "::error::generated $OUT is not a valid plist"; exit 1
              fi
              echo "$OUT: $(jq -r 'keys | length' <<< "$PROFILES") profile(s) mapped"
            }

            if [ "${{ inputs.target_platform }}" != "macos_only" ]; then
              if [ -n "${EXT_MAP_JSON:-}" ] && [ "$EXT_MAP_JSON" != "{}" ]; then
                write_export_options ios \
                  "${{ steps.provision.outputs.uuid || steps.ext_profiles.outputs.app_ios_uuid }}" \
                  iOSExportOptions.plist
                fastlane run build_app \
                  $FL_ARG scheme:"App" \
                  output_directory:"." output_name:"${APP_NAME_SAFE}-iOS.ipa" \
                  export_team_id:"$TEAM_ID" xcargs:"$XCARGS" \
                  skip_profile_detection:true export_options:"iOSExportOptions.plist" \
                  clean:true silent:true
              else
                fastlane run build_app \
                  $FL_ARG scheme:"App" export_method:"app-store" \
                  output_directory:"." output_name:"${APP_NAME_SAFE}-iOS.ipa" \
                  export_team_id:"$TEAM_ID" xcargs:"$XCARGS" clean:true silent:true
              fi
            fi

            if [ "${{ inputs.target_platform }}" == "macos_only" ] || [ "${{ inputs.target_platform }}" == "all_devices" ]; then
              prepare_geolocation_for_catalyst

              MAC_PROFILE_UUID="${{ steps.mac_provision.outputs.uuid || steps.ext_profiles.outputs.app_mac_uuid }}"
              if [ -z "$MAC_PROFILE_UUID" ]; then
                echo "::error::no Mac profile - neither pasted nor fetched"; exit 1
              fi
              
              INSTALLER_CERT_NAME="${{ steps.cert.outputs.installer_cert_name }}"
              
              write_export_options macos "$MAC_PROFILE_UUID" MacExportOptions.plist
              
              MAC_XCARGS="DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE='' PROVISIONING_PROFILE_SPECIFIER=''"
              
              fastlane run build_app \
                $FL_ARG scheme:"App" catalyst_platform:"macos" \
                output_directory:"." output_name:"${APP_NAME_SAFE}-Mac" \
                xcargs:"$MAC_XCARGS" installer_cert_name:"$INSTALLER_CERT_NAME" \
                skip_profile_detection:true export_options:"MacExportOptions.plist" clean:true silent:true
            fi
          fi
      
      - name: GAD Inject
        working-directory: app
        run: |
          GAD_ID=""
          if [ -f "capacitor.config.json" ]; then
            GAD_ID=$(jq -r '.plugins.AdMob.appId // empty' capacitor.config.json 2>/dev/null)
          fi
          if [ -z "$GAD_ID" ] && [ -f "capacitor.config.ts" ]; then
            GAD_ID=$(grep -oE "ca-app-pub-[0-9]+~[0-9]+" capacitor.config.ts | head -1 || true)
          fi
          if [ -z "$GAD_ID" ]; then exit 0; fi
          find ios/App -name "*.app" -type d -maxdepth 5 | while read APP; do
            PLIST="$APP/Info.plist"
            if [ -f "$PLIST" ]; then
              if /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_ID" "$PLIST"
              else
                /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_ID" "$PLIST"
              fi
            fi
          done

      - name: Upload
        if: inputs.build_mode == 'publish_to_appstore'
        working-directory: app/ios/App
        run: |
          API_KEY_CONTENT=$(echo "${{ steps.apple.outputs.api_key_base64 }}" | base64 --decode)
          BUNDLE_ID="${{ steps.capacitor.outputs.bundle_id }}"
          TEAM_ID="${{ steps.apple.outputs.team_id }}"
          API_KEY_PATH="$RUNNER_TEMP/api_key.json"
          
          jq -n \
            --arg key_id "${{ steps.apple.outputs.api_key_id }}" \
            --arg issuer_id "${{ steps.apple.outputs.api_issuer_id }}" \
            --arg key "$API_KEY_CONTENT" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' > "$API_KEY_PATH"
          
          if [ -f "${APP_NAME_SAFE}-iOS.ipa" ]; then
            fastlane run upload_to_app_store \
              api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
              ipa:"${APP_NAME_SAFE}-iOS.ipa" platform:"ios" \
              skip_metadata:true skip_screenshots:true \
              run_precheck_before_submit:false submit_for_review:false \
              skip_app_version_update:true
          fi

          MAC_FILE=""
          if [ -f "${APP_NAME_SAFE}-Mac.ipa" ]; then MAC_FILE="${APP_NAME_SAFE}-Mac.ipa"; MAC_TYPE="ipa"
          elif [ -f "${APP_NAME_SAFE}-Mac.pkg" ]; then MAC_FILE="${APP_NAME_SAFE}-Mac.pkg"; MAC_TYPE="pkg"; fi

          if [ -n "$MAC_FILE" ]; then
            if [ "$MAC_TYPE" == "ipa" ]; then
               fastlane run upload_to_app_store \
                api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
                ipa:"$MAC_FILE" platform:"osx" \
                skip_metadata:true skip_screenshots:true \
                run_precheck_before_submit:false submit_for_review:false \
                skip_app_version_update:true
            else
               fastlane run upload_to_app_store \
                api_key_path:"$API_KEY_PATH" app_identifier:"$BUNDLE_ID" team_id:"$TEAM_ID" \
                pkg:"$MAC_FILE" platform:"osx" \
                skip_metadata:true skip_screenshots:true \
                run_precheck_before_submit:false submit_for_review:false \
                skip_app_version_update:true
            fi
          fi
      
      - name: Artifact iOS Sim
        if: inputs.build_mode == 'build_only' && inputs.target_platform == 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}-iOS-Simulator.app.zip
          retention-days: 1
      
      - name: Artifact macOS
        if: inputs.build_mode == 'build_only' && inputs.target_platform == 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}-macOS.app.zip
          retention-days: 1
      
      - name: Artifact App
        if: inputs.build_mode == 'build_only' && inputs.target_platform != 'all_devices'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_number }}
          path: app/ios/App/${{ env.APP_NAME_SAFE }}.app.zip
          retention-days: 1
      
      - name: Errors
        if: failure()
        run: |
          ERROR_FILE="$RUNNER_TEMP/error-summary.txt"
          echo "$(date -u '+%Y-%m-%d %H:%M UTC')" > "$ERROR_FILE"
          echo "═══════════════════════════════════════════" >> "$ERROR_FILE"
          echo "" >> "$ERROR_FILE"
          SEARCH_DIRS="app/ios/App ~/Library/Logs/gym /tmp"
          for DIR in $SEARCH_DIRS; do
            find $DIR -name "*.log" -o -name "*.txt" 2>/dev/null | head -30 | while read f; do
              grep -iHn "error:" "$f" 2>/dev/null | grep -v "warning:" | tail -30 >> "$ERROR_FILE" || true
              grep -iHn -E "(fatal|undefined symbol|linker|ld: |clang:|no library for this platform|Multiple commands produce|BUILD FAILED)" "$f" 2>/dev/null | tail -20 >> "$ERROR_FILE" || true
              grep -iHn -E "(cannot find|no such module|no library|xcframework|duplicate output)" "$f" 2>/dev/null | tail -20 >> "$ERROR_FILE" || true
              grep -iHn -E "(provisioning|signing|codesign|entitlement|CSSMERR)" "$f" 2>/dev/null | grep -i "error\|fail\|invalid\|no " | tail -15 >> "$ERROR_FILE" || true
            done
          done
          if [ "$(wc -l < "$ERROR_FILE")" -le 3 ]; then
            echo "[xcodebuild stdout/stderr]" >> "$ERROR_FILE"
            find ~/Library/Logs/gym -name "*.log" 2>/dev/null | head -5 | while read f; do
              tail -100 "$f" | grep -i "error\|fail\|no library\|xcframework" >> "$ERROR_FILE" || true
            done
          fi
          sort -u -o "$ERROR_FILE" "$ERROR_FILE"
          cat "$ERROR_FILE"
          echo "error_summary_path=$ERROR_FILE" >> $GITHUB_ENV
      
      - name: Error Upload
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e-${{ github.run_number }}
          path: ${{ env.error_summary_path }}
          retention-days: 1
          if-no-files-found: ignore
      
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: l-${{ github.run_number }}
          path: |
            app/ios/App/build*/**/*.log
            app/ios/App/*.log
            ~/Library/Logs/gym/*.log
          retention-days: 1
          if-no-files-found: ignore
      
      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌" >> $GITHUB_STEP_SUMMARY
          fi

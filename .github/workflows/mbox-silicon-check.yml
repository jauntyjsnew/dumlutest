name: MBOX exact-SHA Apple Silicon validation

on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: "Exact approved 40-character private mboxRUSH commit SHA"
        required: true
        type: string
        default: "a071ab2313f4ac62eb0adb6171c777e128bc6aab"

permissions:
  contents: read

concurrency:
  group: mboxrush-exact-sha-silicon
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APPROVED_APP_SHA: a071ab2313f4ac62eb0adb6171c777e128bc6aab
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      FIXTURE_GIB: "2.2"
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Validate one-time request
        env:
          REQUESTED_SHA: ${{ inputs.app_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::app_sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "$REQUESTED_SHA" != "$APPROVED_APP_SHA" ]]; then
            echo "::error::This one-time workflow accepts only the approved private commit."
            exit 1
          fi

      - name: Checkout exact private commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jauntyjsnew/mboxRUSH
          ref: ${{ inputs.app_sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          fetch-depth: 1
          path: app

      - name: Verify checkout and remove credential risk
        working-directory: app
        env:
          REQUESTED_SHA: ${{ inputs.app_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD 2>/dev/null)" || {
            echo "::error::Could not verify the private checkout."
            exit 1
          }
          if [[ "$actual_sha" != "$REQUESTED_SHA" ]]; then
            echo "::error::Checked-out revision does not match the approved SHA."
            exit 1
          fi
          if git config --local --get-regexp \
            'http\..*\.extraheader|credential\.helper' \
            >/dev/null 2>&1; then
            echo "::error::Checkout credentials remained in private repository configuration."
            exit 1
          fi
          echo "Exact private revision verified; no persisted checkout credential found."

      - name: Prove Apple Silicon runner
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "::error::Runner is not Apple Silicon."
            exit 1
          fi
          if ! xcodebuild -version >"$RUNNER_TEMP/xcode-version.log" 2>&1; then
            echo "::error::Xcode is unavailable."
            exit 1
          fi
          echo "Apple Silicon runner verified."

      - name: Prepare private build dependencies
        run: |
          set -euo pipefail
          if ! rustup target add \
            aarch64-apple-ios-macabi \
            x86_64-apple-ios-macabi \
            >"$RUNNER_TEMP/rust-targets.log" 2>&1; then
            echo "::error::Rust target preparation failed; private details were suppressed."
            exit 1
          fi

          if ! command -v xcodegen >/dev/null 2>&1; then
            if ! brew install xcodegen >"$RUNNER_TEMP/xcodegen-install.log" 2>&1; then
              echo "::error::XcodeGen installation failed; details were suppressed."
              exit 1
            fi
          fi
          echo "Build dependencies are ready."

      - name: Run Cargo workspace tests privately
        working-directory: app/rust-engine
        run: |
          set -euo pipefail
          if ! cargo test --workspace --locked \
            >"$RUNNER_TEMP/cargo-tests.log" 2>&1; then
            echo "::error::Cargo tests failed; private compiler/test output was suppressed."
            exit 1
          fi
          echo "Cargo workspace tests passed."

      - name: Run synthetic 2.2 GiB diagnostic privately
        working-directory: app/rust-engine
        run: |
          set -euo pipefail

          fixture="$RUNNER_TEMP/google-takeout-2.2g.mbox"
          diag_tmp="$RUNNER_TEMP/mbox-diag-tmp"
          host_diag="$PWD/target/release/examples/diag"
          catalyst_diag="$PWD/target/aarch64-apple-ios-macabi/release/examples/diag"
          mkdir -p "$diag_tmp"

          if ! cargo build --quiet --locked --release \
            -p mbox-engine-core --example diag \
            >"$RUNNER_TEMP/diag-host-build.log" 2>&1; then
            echo "::error::Diagnostic generator build failed; private output was suppressed."
            exit 1
          fi

          if ! "$host_diag" gen "$fixture" "$FIXTURE_GIB" \
            >"$RUNNER_TEMP/diag-generate.log" 2>&1; then
            echo "::error::Synthetic fixture generation failed; runtime output was suppressed."
            exit 1
          fi

          fixture_bytes="$(stat -f '%z' "$fixture" 2>/dev/null || true)"
          if [[ ! "$fixture_bytes" =~ ^[0-9]+$ ]] ||
             (( fixture_bytes < 2362232012 )); then
            echo "::error::Synthetic fixture did not reach 2.2 GiB."
            exit 1
          fi

          if ! cargo build --quiet --locked --release \
            -p mbox-engine-core --example diag \
            --target aarch64-apple-ios-macabi \
            >"$RUNNER_TEMP/diag-catalyst-build.log" 2>&1; then
            echo "::error::Apple Silicon Catalyst diagnostic build failed; private output was suppressed."
            exit 1
          fi

          if ! TMPDIR="$diag_tmp" "$catalyst_diag" load "$fixture" \
            >"$RUNNER_TEMP/diag-load.log" 2>&1; then
            echo "::error::2.2 GiB diagnostic process failed; runtime output was suppressed."
            exit 1
          fi

          if ! grep -Eq '^LOAD OK: total_messages=[1-9][0-9]* ' \
            "$RUNNER_TEMP/diag-load.log"; then
            echo "::error::2.2 GiB diagnostic did not report a successful index."
            exit 1
          fi

          if ! grep -q 'lazy read of one message OK' \
            "$RUNNER_TEMP/diag-load.log"; then
            echo "::error::2.2 GiB diagnostic did not verify lazy message reading."
            exit 1
          fi

          echo "Synthetic 2.2 GiB Apple Silicon diagnostic passed."

      - name: Build unsigned universal Mac Catalyst Release privately
        working-directory: app
        run: |
          set -euo pipefail

          derived="$RUNNER_TEMP/MboxRushDerivedData"

          if ! xcodegen generate \
            >"$RUNNER_TEMP/xcodegen.log" 2>&1; then
            echo "::error::Project generation failed; private output was suppressed."
            exit 1
          fi

          if ! xcodebuild \
            -project MboxRush.xcodeproj \
            -scheme MboxRush \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$derived" \
            'ARCHS=arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            MARKETING_VERSION=1.0.14 \
            CURRENT_PROJECT_VERSION=202607310001 \
            build \
            >"$RUNNER_TEMP/xcodebuild-maccatalyst.log" 2>&1; then
            echo "::error::Mac Catalyst Release build failed; private compiler output was suppressed."
            exit 1
          fi

          products="$derived/Build/Products/Release-maccatalyst"
          app_path="$(find "$products" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Mac Catalyst app product was not found."
            exit 1
          fi

          plist="$app_path/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' "$plist" 2>/dev/null || true)"
          binary="$app_path/Contents/MacOS/$executable"

          if [[ -z "$executable" || ! -f "$binary" ]]; then
            echo "::error::Mac Catalyst executable was not found."
            exit 1
          fi

          binary_archs="$(lipo -archs "$binary" 2>/dev/null || true)"
          if [[ " $binary_archs " != *" arm64 "* ]] ||
             [[ " $binary_archs " != *" x86_64 "* ]]; then
            echo "::error::Mac Catalyst executable is not universal arm64 + x86_64."
            exit 1
          fi

          echo "Unsigned universal Mac Catalyst Release build passed."

      - name: Publish controlled summary
        if: success()
        run: |
          {
            echo "## Private MBOX validation passed"
            echo
            echo "- Exact approved private SHA verified"
            echo "- Runner architecture: arm64"
            echo "- Cargo workspace tests: passed"
            echo "- Synthetic 2.2 GiB diagnostic: passed"
            echo "- Mac Catalyst Release: arm64 + x86_64"
            echo "- Private logs/artifacts published: none"
          } >> "$GITHUB_STEP_SUMMARY"

name: MBOX Apple Silicon runtime diagnostic

on:
  workflow_dispatch:
    inputs:
      size_gb:
        description: "Synthetic Gmail Takeout size in GiB"
        required: false
        default: "2.2"
        type: string

permissions:
  contents: read

jobs:
  compare-engines:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout private app repository
        uses: actions/checkout@v4
        with:
          repository: jauntyjsnew/mboxRUSH
          token: ${{ secrets.GH_PAT }}
          # The PAT is needed only for checkout. Do not leave it in app/.git/config where later
          # build scripts could read it.
          persist-credentials: false
          fetch-depth: 0
          path: app

      - name: Prove runner architecture
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "arm64"
          sysctl -n machdep.cpu.brand_string
          sw_vers
          rustc -vV

      - name: Install Apple Silicon Catalyst target
        run: rustup target add aarch64-apple-ios-macabi

      - name: Generate 2.2 GiB Gmail Takeout fixture with 1.0.12 source
        working-directory: app
        run: |
          set -euo pipefail
          git checkout 0d5b7b1
          # Keep compiler diagnostics private: warnings/errors can quote source lines in a public
          # Actions log. The job exposes only the controlled synthetic-fixture result below.
          if ! cargo build --quiet --release --manifest-path rust-engine/Cargo.toml \
            -p mbox-engine-core --example diag \
            >"$RUNNER_TEMP/generator-build.log" 2>&1; then
            echo "Generator build failed; private compiler log was not published."
            exit 1
          fi
          ./rust-engine/target/release/examples/diag \
            gen "$RUNNER_TEMP/google-takeout.mbox" "${{ inputs.size_gb }}"
          ls -lh "$RUNNER_TEMP/google-takeout.mbox"

      - name: Run 1.0.12 engine as arm64 Mac Catalyst
        id: old
        continue-on-error: true
        working-directory: app/rust-engine
        run: |
          set -euo pipefail
          if ! cargo build --quiet --release -p mbox-engine-core --example diag \
            --target aarch64-apple-ios-macabi >"$RUNNER_TEMP/old-build.log" 2>&1; then
            echo "1.0.12 build failed; private compiler log was not published."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/old-tmp"
          if ! TMPDIR="$RUNNER_TEMP/old-tmp" RUST_BACKTRACE=0 /usr/bin/time -l \
            ./target/aarch64-apple-ios-macabi/release/examples/diag \
            load "$RUNNER_TEMP/google-takeout.mbox" \
            >"$RUNNER_TEMP/old.log" 2>"$RUNNER_TEMP/old-time.log"; then
            echo "1.0.12 runtime check failed; private runtime output was not published."
            exit 1
          fi
          grep -q "LOAD OK: total_messages=36020" "$RUNNER_TEMP/old.log"
          grep -q "lazy read of one message OK" "$RUNNER_TEMP/old.log"
          grep -E "LOAD OK:|lazy read of one message OK" "$RUNNER_TEMP/old.log"

      - name: Run 1.0.13 engine as arm64 Mac Catalyst
        id: current
        working-directory: app
        run: |
          set -euo pipefail
          git checkout f21b84b
          if ! cargo build --quiet --release --manifest-path rust-engine/Cargo.toml \
            -p mbox-engine-core --example diag \
            --target aarch64-apple-ios-macabi >"$RUNNER_TEMP/current-build.log" 2>&1; then
            echo "1.0.13 build failed; private compiler log was not published."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/current-tmp"
          if ! TMPDIR="$RUNNER_TEMP/current-tmp" RUST_BACKTRACE=0 /usr/bin/time -l \
            ./rust-engine/target/aarch64-apple-ios-macabi/release/examples/diag \
            load "$RUNNER_TEMP/google-takeout.mbox" \
            >"$RUNNER_TEMP/current.log" 2>"$RUNNER_TEMP/current-time.log"; then
            echo "1.0.13 runtime check failed; private runtime output was not published."
            exit 1
          fi
          grep -q "LOAD OK: total_messages=36020" "$RUNNER_TEMP/current.log"
          grep -q "lazy read of one message OK" "$RUNNER_TEMP/current.log"
          grep -E "LOAD OK:|lazy read of one message OK" "$RUNNER_TEMP/current.log"

      - name: Publish diagnostic summary
        if: always()
        run: |
          {
            echo "## MBOX Apple Silicon runtime comparison"
            echo
            echo "- Runner: $(uname -m) / $(sysctl -n machdep.cpu.brand_string)"
            echo "- Fixture: ${{ inputs.size_gb }} GiB Gmail Takeout-style MBOX"
            echo "- 1.0.12 check: ${{ steps.old.outcome }}"
            echo "- 1.0.13 check: ${{ steps.current.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
